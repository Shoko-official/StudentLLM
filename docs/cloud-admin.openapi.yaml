        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreateRequest" }
      responses:
        "201":
          description: Invitation created and emailed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/invitations/accept:
    post:
      tags: [admins]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        The only route open to a verified Access identity that has no admin record. The identity's email must
        equal the invitation email; the body carries the emailed code. Wrong code, wrong identity, expired,
        used and over-attempted (5 attempts) all return the same `invitation_invalid`. The role comes from the
        invitation, never from the request. Naturally single-use, so there is no idempotency key. Notifies the
        owners.
