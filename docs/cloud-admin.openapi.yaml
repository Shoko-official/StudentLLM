    post:
      tags: [admins]
      operationId: createInvitation
      summary: Invite an admin by email with a role
      description: |
        Creates a single-use invitation that expires (72 hours by default, 168 at most). The service emails a
        12-character code to the invited address; the code is stored only as a keyed hash and is never returned
        by the API or shown to the inviting owner. The invitation is accepted only by a request whose verified
        Access identity has the invited email, so the owner must also add that email to the Access allowlist
        (a manual step in v1). Needs a fresh re-authentication; notifies the owners. One pending invitation
        per email.
      x-required-role: owner
      x-requires-fresh-auth: true
      x-destructive: true
      x-audit-action: admin.invite
      parameters:
