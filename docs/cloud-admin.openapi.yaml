openapi: 3.1.0
info:
  title: StudentLLM Cloud Admin API
  version: 1.0.0-draft
  summary: Planned HTTP contract of the admin surface of the optional StudentLLM cloud service (not implemented).
  description: |
    Machine-readable contract of the admin surface. `docs/cloud-admin.md` explains it and holds the design
    decisions; `docs/cloud-plan.md` holds the product plan. Draft for review. Conformance fixtures live in
    `docs/cloud-admin-fixtures/`.

    **Separate surface.** This API is served only on the admin hostname, under the `/admin/v1` prefix, behind a
    zero-trust gate (Cloudflare Access or an equivalent). The desktop app never calls it. The public contract
    (`docs/cloud-api.openapi.yaml`) does not list it, and the public API never accepts an admin credential.

    **Authentication.** Every request carries the Access JWT in `Cf-Access-Jwt-Assertion`. The admin service
    verifies it itself (signature, issuer, audience, expiry, pinned algorithm), maps the verified email to an
    admin record and fails closed. There are no passwords, no API keys and no long-lived admin tokens. Operations
    marked `x-requires-fresh-auth` need a re-authentication within the last 300 seconds
    (`reauth_required` otherwise).

    **Roles.** `support` < `admin` < `owner`. Each operation states the minimum role in `x-required-role`
    (`invitee` is the single route open to a verified identity that is not yet an admin). A higher role always
    includes a lower one, except where `x-required-role` is `owner` (only owners).

    **Writes.** Every state-changing operation (any non-GET route, except the read-only POST routes marked
    `x-read-only`) needs: the CSRF header, an `Idempotency-Key`, and a mandatory `reason` in the body. They are
    all blocked by the global freeze (`admin_writes_frozen`) unless marked `x-allowed-when-frozen`. Operations
    marked `x-destructive` additionally notify the owners by email.

    **Privacy.** The admin surface returns only what the service stores. No response, audit row or error carries
    course content, a prompt, a model answer, an IP address, a token or a one-time code.

    **Errors.** One envelope (`Error`), the same style as the public API, with its own code list (`ErrorCode`).
    Messages are English, short, and never contain content, secrets or provider text.

    **Pagination.** Cursor pagination: request `limit` and `cursor`, response `data` and `next_cursor`
    (`null` on the last page). No offset pagination.

    **Versioning.** The `/admin/v1` prefix is stable. Additive changes (optional fields, endpoints, error codes,
    enum values clients must tolerate) are allowed inside it. Hard ceilings written as schema `maximum` values
    (for example grant days and credits) can only be lowered by configuration and raised by a new contract version.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://admin.example.invalid
    description: "[PLACEHOLDER: admin hostname, distinct from the public API hostname]"
security:
  - cloudflareAccess: []
tags:
  - name: session
  - name: system
  - name: accounts
  - name: grants
  - name: billing
  - name: moderation
  - name: admins
  - name: audit
paths:
  /admin/v1/session:
    get:
      tags: [session]
      operationId: getAdminSession
      summary: Who am I, plus the CSRF token for this session
      description: |
        Maps the verified Access identity to an admin record and returns the role, the freshness of the last
        re-authentication, the freeze state and a CSRF token bound to this session (kept in memory by the UI,
        never in storage or a URL). The first call of a new session writes an `admin.session_start` audit row.
        A verified identity with no admin record gets `admin_not_registered`; the UI then offers the invitation
        screen (the only route open to such an identity is `POST /admin/v1/invitations/accept`).
      x-required-role: support
      x-audit-action: admin.session_start
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/session/reauth:
    post:
      tags: [session]
      operationId: startReauth
      summary: Start a step-up re-authentication
      description: |
        Records that a step-up started now and returns the URL that forces a fresh login at the gate (a
        dedicated Access application with the shortest session lifetime, or the service-side passkey step-up
        if the platform cannot do that; see the design document). The step-up completes on
        `GET /admin/v1/session/reauth/complete`. Not a data change: no idempotency key or reason.
      x-required-role: support
      x-read-only: true
      x-allowed-when-frozen: true
      x-audit-action: admin.reauth_start
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: Where to go.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthStart" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/session/reauth/complete:
    get:
      tags: [session]
      operationId: completeReauth
      summary: Finish a step-up re-authentication (browser redirect target)
      description: |
        Accepted only if a step-up was started for this session and the presented Access JWT was issued after it
        started. On success the session records `reauth_at = now` and the browser is redirected to the UI. On
        any failure the redirect carries `?reauth=failed` with no detail. The route changes only the caller's
        own session freshness, from verified data, so a forged navigation gives an attacker nothing.
      x-required-role: support
      x-allowed-when-frozen: true
      x-audit-action: admin.reauth_complete
      responses:
        "303":
          description: Redirect to the UI.
          headers:
            Location: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/v1/system:
    get:
      tags: [system]
      operationId: getSystemState
      summary: Freeze state, configured limits and the audit chain head
      x-required-role: support
      responses:
        "200":
          description: System state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/system/freeze:
    post:
      tags: [system]
      operationId: freezeAdminWrites
      summary: Freeze all admin writes (kill switch)
      description: |
        Every write route then returns `admin_writes_frozen`; reads, the audit log and the unfreeze route keep
        working. Any admin may freeze (a fast response to a suspected compromise); only an owner can unfreeze.
        Repeating while frozen is a no-op that returns the current state. Notifies the owners.
      x-required-role: admin
      x-allowed-when-frozen: true
      x-destructive: true
      x-audit-action: system.freeze
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Frozen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/system/unfreeze:
    post:
      tags: [system]
      operationId: unfreezeAdminWrites
      summary: Lift the freeze (owner, fresh re-authentication)
      x-required-role: owner
      x-requires-fresh-auth: true
      x-allowed-when-frozen: true
      x-destructive: true
      x-audit-action: system.unfreeze
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Unfrozen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/accounts/search:
    post:
      tags: [accounts]
      operationId: searchAccounts
      summary: Search accounts by email, email prefix, account id or status
      description: |
        A POST with a JSON body so that an email address never appears in a URL, a log line or browser
        history. Read only: no reason and no idempotency key. The email is the stored sign-in email,
        compared after the same normalization the service uses. `email_prefix` needs at least 6 characters.
        Pages hold at most 25 results and the route has its own tight rate limit. The audit row records the
        kind of query and the number of results, never the query value.
      x-required-role: support
      x-read-only: true
      x-audit-action: account.search
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountSearchRequest" }
      responses:
        "200":
          description: A page of account summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}:
    get:
      tags: [accounts]
      operationId: getAdminAccount
      summary: Read one account record
      description: |
        Account metadata only: id, verified email, login methods, status, plan and budget windows (with their
        source), usage totals, device count, consent state, pending operations. `billing` (Paddle ids) is `null`
        for the `support` role. Never contains content. Every call writes an `account.read` audit row before
        the response is sent; if the audit write fails the read fails (`audit_unavailable`).
      x-required-role: support
      x-audit-action: account.read
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: The account.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/devices:
    get:
      tags: [accounts]
      operationId: listAccountDevices
      summary: List the devices and their session metadata
      description: Device label, platform name, dates and expiry only. No IP address and no token. Audited as `account.devices_read`.
      x-required-role: support
      x-audit-action: account.devices_read
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Devices (at most 3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/devices/{device_id}/revoke:
    post:
      tags: [accounts]
      operationId: revokeAccountDevice
      summary: Revoke one device and its session family
      description: |
        Uses the same domain function as `DELETE /v1/devices/{device_id}`: the revocation is written to the
        account's Durable Object and is effective on the next inference request. Sends a notification email to the
        account address unless `notify_user` is false.
      x-required-role: admin
      x-audit-action: device.revoke
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: Revoked (idempotent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/sessions/revoke-all:
    post:
      tags: [accounts]
      operationId: revokeAllAccountSessions
      summary: Revoke every session and manage token of an account
      description: |
        Revokes all session families, all devices and all unexpired manage tokens through the same domain
        functions the public API uses. The account itself is unchanged (use the suspend route to block it). Sends
        a notification email unless `notify_user` is false.
      x-required-role: admin
      x-audit-action: sessions.revoke_all
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: Revoked (idempotent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/grants:
    get:
      tags: [grants]
      operationId: listAccountGrants
      summary: List the complimentary grants of an account
      description: Audited as `grant.list`. Paginated.
      x-required-role: support
      x-audit-action: grant.list
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of grants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [grants]
      operationId: createGrant
      summary: Grant a complimentary period (free trial)
      description: |
        Creates a grant and its budget windows with source `admin_grant`, with no payment. `days` is explicit
        (1 to the configured maximum, never above the contract ceiling of 90). `credit_budget_per_window` is an
        optional override, within the configured cap (never above the contract ceiling); the default is the
        standard Plus window limit. A grant is split into windows of at most 30 days (the last one prorated and
        rounded down). Rules, enforced by the shared window domain function:
        one window per period and no stacking (a grant never overlaps another window);
        `start_policy: now` is refused with `window_overlap` while a paid or granted window is active;
        `after_current_windows` queues after windows whose end is known and is refused for an auto-renewing
        subscription; the account must be `active`; the per-grant total credit cap, the per-account yearly
        grant-day cap, the per-admin daily count and the global monthly grant credit cap must all hold
        (`limit_exceeded` with `details.limit`). The target cannot be the acting admin's own user account
        (`self_action_forbidden`). Sends a notification email unless `notify_user` is false.
      x-required-role: admin
      x-audit-action: grant.create
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantCreateRequest" }
      responses:
        "201":
          description: Grant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/grants/{grant_id}:
    get:
      tags: [grants]
      operationId: getGrant
      summary: Read one grant
      description: Audited as `grant.read`.
      x-required-role: support
      x-audit-action: grant.read
      parameters:
        - { $ref: "#/components/parameters/GrantId" }
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/grants/{grant_id}/shorten:
    post:
      tags: [grants]
      operationId: shortenGrant
      summary: Shorten a grant
      description: |
        Moves the end of the grant earlier (never later; a longer period is a new grant, so the caps stay
        honest). Windows after the new end are removed, the window containing it is cut, and credits already
        used stay used. Bumps the plan version. Sends a notification email unless `notify_user` is false.
      x-required-role: admin
      x-audit-action: grant.shorten
      parameters:
        - { $ref: "#/components/parameters/GrantId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantShortenRequest" }
      responses:
        "200":
          description: Shortened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/grants/{grant_id}/revoke:
    post:
      tags: [grants]
      operationId: revokeGrant
      summary: Revoke a grant
      description: |
        Ends every window of the grant now; the remaining credits become unusable on the next request (the
        revocation is written to the account's Durable Object). Credits already used stay used and counted.
        Only the grant's own windows are touched, never a paid window. Bumps the plan version.
      x-required-role: admin
      x-audit-action: grant.revoke
      parameters:
        - { $ref: "#/components/parameters/GrantId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: Revoked (idempotent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/stats/grants:
    get:
      tags: [grants]
      operationId: getGrantStats
      summary: Grant totals for cost monitoring
      description: |
        Aggregates only, no account ids: credits granted and used by month, the configured monthly cap and how
        much of it is committed. The same totals feed the gateway's cost monitoring and the global spend cap.
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/accounts/{account_id}/subscription/cancel:
    post:
      tags: [billing]
      operationId: cancelSubscription
      summary: Cancel (résilier) the Paddle subscription
      description: |
        `effective_from: period_end` schedules the cancellation at the end of the paid period (Paddle
        `next_billing_period`); `immediately` cancels now, ends the current paid window at once and needs a
        fresh re-authentication. The call creates an operation and answers 202 with state `pending`: the
        windows change only when Paddle has confirmed (the response of the cancel call, then the subscription
        webhook). A failure leaves the operation `pending` with `next_retry_at` (bounded backoff, an owner
        alert after repeated failures) and an admin can retry it. A semester pass has no subscription to cancel:
        the route returns `state_conflict`. Refunds are not issued here (see the design document). Sends a
        notification email unless `notify_user` is false.
      x-required-role: admin
      x-audit-action: subscription.cancel
      x-conditionally-fresh-auth: "effective_from = immediately"
      x-conditionally-destructive: "effective_from = immediately"
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "202":
          description: Accepted; the operation is pending until Paddle confirms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/operations:
    get:
      tags: [billing]
      operationId: listOperations
      summary: List cancellation and deletion operations
      description: Filter by state to find what is pending or failed. Paginated. Not an account read, so not individually audited.
      x-required-role: support
      parameters:
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/OperationState" } }
        - { $ref: "#/components/parameters/Limit" }
