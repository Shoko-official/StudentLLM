    AuditList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditRow" }
        next_cursor: { type: [string, "null"] }
    AuditExportRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        from_seq: { type: integer, minimum: 1 }
        to_seq: { type: integer, minimum: 1 }
        reason: { $ref: "#/components/schemas/Reason" }
    AuditVerification:
      type: object
      required: [ok, rows_checked, head_seq, head_hash, first_broken_seq, anchors_checked, anchor_signatures_valid, anchors_match, last_anchor_seq]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        rows_checked: { type: integer, minimum: 0 }
        head_seq: { type: integer, minimum: 0 }
        head_hash: { $ref: "#/components/schemas/Sha256Hex" }
        first_broken_seq: { type: [integer, "null"] }
        anchors_checked: { type: integer, minimum: 0 }
        anchor_signatures_valid: { type: boolean, description: Every Ed25519 anchor signature verifies under the published public key. }
        anchors_match: { type: boolean, description: The recomputed chain agrees with every published anchor. }
        last_anchor_seq: { type: [integer, "null"], description: Sequence number of the latest head digest published outside the database. }
    SystemState:
      type: object
      required: [writes_frozen, frozen_at, frozen_by_admin_id, audit_writer_available, limits, audit_head_seq, audit_head_hash]
      additionalProperties: false
      properties:
        writes_frozen: { type: boolean }
        frozen_at: { type: [string, "null"], format: date-time }
        frozen_by_admin_id: { type: [string, "null"] }
        audit_writer_available: { type: boolean }
        limits: { $ref: "#/components/schemas/AdminLimits" }
        audit_head_seq: { type: integer, minimum: 0 }
        audit_head_hash: { $ref: "#/components/schemas/Sha256Hex" }
