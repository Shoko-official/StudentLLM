            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/admins/{admin_id}/role:
    post:
      tags: [admins]
      operationId: changeAdminRole
      summary: Change an admin's role
      description: |
        Owner only, fresh re-authentication, notifies the owners. An owner cannot change their own role
        (`self_action_forbidden`). Demoting the last enabled owner is refused (`last_owner_protected`); the
        check and the change are one atomic step. The admin's open sessions are ended so the new role applies
        at once.
      x-required-role: owner
      x-requires-fresh-auth: true
      x-destructive: true
      x-audit-action: admin.role_change
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleChangeRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
