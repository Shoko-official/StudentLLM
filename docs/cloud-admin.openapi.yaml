      x-allowed-when-frozen: false
      x-audit-action: admin.invitation_accept
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptRequest" }
      responses:
