  /admin/v1/accounts/{account_id}/suspend:
    post:
      tags: [moderation]
      operationId: suspendAccount
      summary: Ban or suspend an account
      description: |
        Sets the account status to `suspended` (the existing `account_suspended` behavior), revokes all sessions
        and manage tokens, and optionally adds a keyed-hash entry to the blocklist so the email and the Google
        subject id cannot register again. Data-rights routes keep working exactly as the public contract
        requires. `duration_days` makes the suspension time-limited (a scheduled job lifts it and writes a
        system audit row); omitted means until an admin lifts it. Needs a fresh re-authentication; notifies the
        owners. The user gets a notification email with a fixed text for the reason category and the support
        route, unless `notify_user` is false. Cannot target the acting admin's own user account.
