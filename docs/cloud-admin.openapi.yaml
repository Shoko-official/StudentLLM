openapi: 3.1.0
info:
  title: StudentLLM Cloud Admin API
  version: 1.1.0-draft
  summary: Planned HTTP contract of the admin surface of the optional StudentLLM cloud service (not implemented).
  description: |
    Machine-readable contract of the admin surface. `docs/cloud-admin.md` explains it and holds the design
    decisions; `docs/cloud-plan.md` holds the product plan. Draft for review. Conformance fixtures live in
    `docs/cloud-admin-fixtures/`.

    **Separate surface.** This API is served only on the admin hostname, under the `/admin/v1` prefix, behind a
    zero-trust gate (Cloudflare Access or an equivalent). The desktop app never calls it. The public contract
    (`docs/cloud-api.openapi.yaml`) does not list it, and the public API never accepts an admin credential.

    **Phases.** The first cut has the owner role only. Operations marked `x-phase: later` (invitations, admin
    management, the blocklist) and the `admin` and `support` roles are designed here so that the contract is stable,
    but they do not ship in the first cut. `x-required-role` states the minimum role of the target design; in the
    first cut the only existing role is `owner`.

    **Authentication.** Every request carries the Access JWT in `Cf-Access-Jwt-Assertion`. The admin service
    verifies it itself (signature, issuer, audience, expiry, pinned algorithm), maps the verified email to an admin
    record and fails closed. It never trusts `Cf-Access-Authenticated-User-Email`. There are no passwords, no API
    keys and no long-lived admin tokens. Every route except `createAdminSession` (and the later-phase
    `acceptInvitation`) carries the session-bound token in `X-StudentLLM-Admin-CSRF`.

    **Step-up.** Operations marked `x-requires-stepup` need an in-service WebAuthn assertion (user verification
    required) bound to that one action (method, full path, body hash), single use, valid 5 minutes, sent in
    `X-StudentLLM-Admin-StepUp`. Freshness is per action, never per session.

    **Writes.** Every state-changing operation (any non-GET route, except the read-only POST routes marked
    `x-read-only` and the single-use invitation accept) needs the CSRF header, an `Idempotency-Key` and a mandatory
    `reason`. Writes are blocked by the global freeze (`admin_writes_frozen`) unless `x-allowed-when-frozen` is
    true. Operations marked `x-destructive` or `x-notifies-owner` email the owners.

    **Audit.** Operations with an `x-audit-action` write a write-ahead intent row, then the action, then a
    completion row; if the audit writer is unavailable they answer 503 and change nothing. Freeze and unfreeze
    (`x-audit-independent`) do not depend on the audit writer.

    **Privacy.** The admin surface returns only what the service stores. No response, audit row or error carries
    course content, a prompt, a model answer, an IP address, a token or a one-time code.

    **Errors.** One envelope (`Error`), the same style as the public API, with its own code list (`ErrorCode`).
    Messages are English, short, and never contain content, secrets or provider text.

    **Pagination.** Cursor pagination: request `limit` and `cursor`, response `data` and `next_cursor` (`null` on
    the last page). A cursor is an HMAC-bound opaque value tied to the filter and the role; reusing it with another
    filter or role gives `invalid_request`. No offset pagination.

    **Versioning.** The `/admin/v1` prefix is stable. Additive changes (optional fields, endpoints, error codes,
    enum values clients must tolerate) are allowed inside it. Hard ceilings written as schema `maximum` values can
    only be lowered by configuration and raised by a new contract version.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://admin.example.invalid
    description: "[PLACEHOLDER: admin hostname, distinct from the public API hostname]"
security:
  - cloudflareAccess: []
tags:
  - name: session
  - name: system
  - name: accounts
  - name: grants
  - name: billing
  - name: moderation
  - name: admins
  - name: audit
paths:
  /admin/v1/session:
    post:
      tags: [session]
      operationId: createAdminSession
      summary: "Create an admin session"
      description: |
        Maps the verified Access identity to an admin record and creates a server-side session keyed by a
        random nonce, bound to the Access identity (`sub` and the login `iat`). Returns the session token (the CSRF
        token) once. The UI keeps it in memory only and calls this route again after a page load. At most 3 sessions
        per admin; the oldest is ended. A verified identity with no admin record gets `admin_not_registered`; the UI
        then offers the invitation screen (later phase). Freshness is never part of a session: sensitive actions need
        an action-bound step-up.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-allowed-when-frozen: true
      x-csrf-exempt: true
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: admin.session_start
      responses:
        "201":
          description: "The session."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSessionCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [session]
      operationId: getAdminSession
      summary: "Read the current session"
      description: |
        Role, expiry, freeze state and credential count. No token. The UI uses it to show the expiry warning.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-destructive: false
      x-notifies-owner: false
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: "The session."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/session/end:
    post:
      tags: [session]
      operationId: endAdminSession
      summary: "End the session"
      description: |
        Ends the server-side session. Idempotent.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: admin.session_end
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204":
          description: "Ended."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/stepup/challenge:
    post:
      tags: [session]
      operationId: createStepUpChallenge
      summary: "Get a WebAuthn challenge for one action"
      description: |
        Step-up is in-service WebAuthn with user verification required. The challenge is bound to the method,
        the full path and the SHA-256 of the canonical body of exactly one action, is single use and valid for 5
        minutes. The browser signs it (no navigation, no popup, the dialog state is kept) and the action request carries
        the assertion in `X-StudentLLM-Admin-StepUp`. The server verifies the binding, the credential, the user
        verification flag and the signature counter, and consumes the challenge in the same transaction as the idempotency
        record of the action. One step-up covers one action.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpChallengeRequest" }
      responses:
        "200":
          description: "Challenge options."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/credentials:
    get:
      tags: [session]
      operationId: listCredentials
      summary: "List registered WebAuthn credentials"
      description: |
        Labels and dates only. Audited as `credential.list`.
      x-required-role: owner
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: credential.list
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: "Credentials."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/credentials/registration/options:
    post:
      tags: [session]
      operationId: beginCredentialRegistration
      summary: "Start registering a WebAuthn credential"
      description: |
        Returns creation options. The first credential is enrolled with the single-use `enrollment_ticket`
        printed by the bootstrap script (no credential exists yet to step up with); every later credential needs an
        action-bound step-up on the completion call. Refused while writes are frozen. At least two credentials (a
        primary key and an offline backup key) should be registered; the session reports the count.
      x-required-role: owner
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-allowed-when-frozen: false
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRegistrationStart" }
      responses:
        "200":
          description: "Creation options."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRegistrationOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/credentials/registration/complete:
    post:
      tags: [session]
      operationId: completeCredentialRegistration
      summary: "Finish registering a WebAuthn credential"
      description: |
        Verifies the attestation and stores the public key. Needs a step-up, or the enrollment ticket for the first credential.
      x-required-role: owner
      x-phase: first
      x-read-only: false
      x-requires-stepup: true
      x-allowed-when-frozen: false
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: true
      x-audit-action: admin.credential_register
      x-stepup-alternative: enrollment_ticket
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/StepUpHeaderOptional" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRegistrationComplete" }
      responses:
        "201":
          description: "Registered."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/credentials/{credential_id}/remove:
    post:
      tags: [session]
      operationId: removeCredential
      summary: "Remove a WebAuthn credential"
      description: |
        Refused for the last credential (`state_conflict`).
      x-required-role: owner
      x-phase: first
      x-read-only: false
      x-requires-stepup: true
      x-allowed-when-frozen: false
      x-csrf-exempt: false
      x-destructive: true
      x-notifies-owner: true
      x-audit-action: admin.credential_remove
      parameters:
        - { $ref: "#/components/parameters/CredentialId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: "Removed (idempotent)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/system:
    get:
      tags: [system]
      operationId: getSystemState
      summary: "Freeze state, limits and the audit chain head"
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-destructive: false
      x-notifies-owner: false
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: "System state."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/system/freeze:
    post:
      tags: [system]
      operationId: freezeAdminWrites
      summary: "Freeze admin writes (kill switch)"
      description: |
        Every write route then returns `admin_writes_frozen`, and the system pauses every execution step of an
        admin-originated operation (deletion execution and Paddle retries; lifting expiries is allowed). Containment
        writes, reads, the audit log and unfreeze keep working. Any admin may freeze; only an owner can unfreeze. Repeating
        while frozen is a no-op that returns the current state. This route does not depend on the audit writer: it
        records a durable local journal entry first and back-fills the audit row. A platform variable override is the last
        resort. Notifies the owners.
      x-required-role: admin
      x-phase: first
      x-read-only: false
      x-requires-stepup: false
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: true
      x-notifies-owner: true
      x-audit-action: system.freeze
      x-audit-independent: true
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: "Frozen."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/system/unfreeze:
    post:
      tags: [system]
      operationId: unfreezeAdminWrites
      summary: "Lift the freeze"
      description: |
        Owner only, action-bound step-up. Like freeze, it does not depend on the audit writer.
      x-required-role: owner
      x-phase: first
      x-read-only: false
      x-requires-stepup: true
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: true
      x-notifies-owner: true
      x-audit-action: system.unfreeze
      x-audit-independent: true
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: "Unfrozen."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/v1/accounts/search:
    post:
      tags: [accounts]
      operationId: searchAccounts
      summary: "Search accounts"
      description: |
        A POST with a JSON body so that an email address never appears in a URL, a log line or browser history.
        Read only: no reason, no idempotency key. Results are masked (`jo***@gmail.com`); the full email is revealed only
        by the audited account read. A key lookup (`account_id`, exact `email`, or an `email_prefix` of at least 6
        characters) stands alone. A `status` or `plan_id` filter is valid only together with a creation window of at most
        7 days. Pages hold at most 25 results, the route has a tight rate limit, and the distinct accounts surfaced per
        admin per day are capped (`limit_exceeded`). The audit row holds the kind of query, the number of results and a
        keyed HMAC of the query value, never the value.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: account.search
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountSearchRequest" }
      responses:
        "200":
          description: "A page of masked account summaries."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}:
    get:
      tags: [accounts]
      operationId: getAdminAccount
      summary: "Read one account record"
      description: |
        Account metadata only: id, full verified email, login methods, status, plan and budget windows (with
        their source), usage totals, device count, consent summary, pending operations. `billing` (Paddle ids) is `null`
        below the admin role. Never contains content. The required `purpose` is recorded in the audit row. Every call
        writes an `account.read` row before the response is sent; if the audit write fails the read fails.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: account.read
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/Purpose" }
      responses:
        "200":
          description: "The account."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/devices:
    get:
      tags: [accounts]
      operationId: listAccountDevices
      summary: "List the devices and their session metadata"
      description: |
        Label, platform name, dates and expiry only. No IP address, no token. Audited as `account.devices_read`.
      x-required-role: support
      x-phase: first
      x-read-only: true
      x-requires-stepup: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: account.devices_read
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: "Devices (at most 3)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDeviceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/devices/{device_id}/revoke:
    post:
      tags: [accounts]
      operationId: revokeAccountDevice
      summary: "Revoke one device"
      description: |
        Containment write. The `device_id` must belong to the `account_id` of the path, otherwise `not_found`
        (an ownership check, not only an existence check). Same domain function as `DELETE /v1/devices/{device_id}`.
      x-required-role: owner
      x-phase: first
      x-read-only: false
      x-requires-stepup: true
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: device.revoke
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: "Revoked (idempotent)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/sessions/revoke-all:
    post:
      tags: [accounts]
      operationId: revokeAllAccountSessions
      summary: "Revoke every session and manage token of an account"
      description: |
        Containment write. Revokes all session families, devices and unexpired manage tokens through the shared functions (`revokeManageTokens` is a new domain function).
      x-required-role: owner
      x-phase: first
      x-read-only: false
      x-requires-stepup: true
      x-allowed-when-frozen: true
      x-csrf-exempt: false
      x-destructive: false
      x-notifies-owner: false
      x-audit-action: sessions.revoke_all
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: "Revoked (idempotent)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
