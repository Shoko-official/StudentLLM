components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        The Access-issued JWT. The admin service verifies it itself: pinned signature algorithm, keys from the
        Access team's JWKS (cached by `kid` with a bounded last-known-good lifetime), exact issuer, audience equal
        to the admin application's AUD tag (never any other Access application), expiry and not-before. The
        verified `email` claim is mapped to an admin record by exact match. The header
        `Cf-Access-Authenticated-User-Email` is never trusted. A request without a valid JWT is rejected even if the
        gate is misconfigured. A StudentLLM access token or a manage token is never accepted here, and this JWT is
        never accepted by the public API.
  parameters:
    CsrfHeader:
      name: X-StudentLLM-Admin-CSRF
      in: header
      required: true
      description: |
        The session-bound token returned once by `createAdminSession` (`<session id>.<mac>`), kept in memory by the
        UI. It identifies the server-side session and doubles as the CSRF defence. The service also requires `Origin`
        equal to the admin hostname, `Sec-Fetch-Site: same-origin` and `Content-Type: application/json`; there is no
        CORS. Failure gives `csrf_invalid`; an unknown or expired session gives `session_expired`.
      schema: { type: string, minLength: 20, maxLength: 160 }
    StepUpHeader:
      name: X-StudentLLM-Admin-StepUp
      in: header
      required: true
      description: |
        `<challenge_id>.<base64url WebAuthn assertion>` for exactly this method, full path and body. Single use.
        Missing gives `stepup_required`; any verification failure (unknown, used, expired, wrong binding, bad
        signature, user verification missing, counter not increasing) gives `stepup_invalid`.
      schema: { type: string, minLength: 20, maxLength: 4096 }
    StepUpHeaderOptional:
      name: X-StudentLLM-Admin-StepUp
      in: header
      required: false
      description: Required unless the registration was authorised by the single-use enrollment ticket of the bootstrap script.
      schema: { type: string, minLength: 20, maxLength: 4096 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client UUID, scoped per admin, valid 24 hours. The record stores a SHA-256 over the method, the full path
        (with query) and the canonical body (RFC 8785). Looked up right after authentication, the session check and
        the role check, before the freeze and step-up checks, so a finished request is replayed without a new
        step-up. Same key and same digest, first call finished: the original status and body again with
        `Idempotent-Replay: true`. Same key while the first call runs: 409 `idempotency_conflict`,
        `details.state = in_progress`. An `in_flight` record older than its TTL (120 seconds) can be taken over by the
        same request. Same key with a different digest: 409, `details.state = payload_mismatch`.
      schema: { type: string, format: uuid }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, pattern: "^dev_[A-Za-z0-9]+$" }
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/GrantId" }
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OperationId" }
    BlocklistEntryId:
      name: entry_id
      in: path
      required: true
      schema: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, pattern: "^inv_[A-Za-z0-9]+$" }
    AdminId:
      name: admin_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AdminId" }
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CredentialId" }
    Purpose:
      name: purpose
      in: query
      required: true
      description: Why the record is being read. Recorded in the audit row.
      schema: { $ref: "#/components/schemas/AccessPurpose" }
    OperationStateFilter:
      name: state
      in: query
      required: false
      schema: { $ref: "#/components/schemas/OperationState" }
    ActorAdminId:
      name: actor_admin_id
      in: query
      required: false
      schema: { $ref: "#/components/schemas/AdminId" }
    TargetAccountId:
      name: target_account_id
      in: query
      required: false
      schema: { $ref: "#/components/schemas/AccountId" }
    ActionFilter:
      name: action
      in: query
      required: false
      schema: { $ref: "#/components/schemas/AuditAction" }
    ResultFilter:
      name: result
      in: query
      required: false
      schema: { $ref: "#/components/schemas/AuditResult" }
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 100 (25 for account search).
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-bound cursor from `next_cursor`, valid only for the same filter and role.
      schema: { type: string, maxLength: 512 }
  responses:
    BadRequest:
      description: invalid_request, confirmation_mismatch or invitation_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: invalid_access_token, session_expired, stepup_required or stepup_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: admin_not_registered, admin_disabled, forbidden_role, self_action_forbidden or csrf_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: idempotency_conflict, state_conflict, window_overlap or last_owner_protected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: limit_exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: rate_limited.
      headers:
        Retry-After: { schema: { type: integer, minimum: 0 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: admin_writes_frozen, audit_unavailable or internal_error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_access_token
        - session_expired
        - stepup_required
        - stepup_invalid
        - admin_not_registered
        - admin_disabled
        - forbidden_role
        - self_action_forbidden
        - csrf_invalid
        - not_found
        - idempotency_conflict
        - state_conflict
        - window_overlap
        - last_owner_protected
        - limit_exceeded
        - confirmation_mismatch
        - invitation_invalid
        - rate_limited
        - admin_writes_frozen
        - audit_unavailable
        - internal_error
    Error:
      type: object
      description: The one error envelope. Never contains content, secrets, tokens or provider text.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, maxLength: 200 }
            request_id: { type: string }
            retry_after_seconds: { type: integer, minimum: 0 }
            details:
              type: object
              description: "Small structured hints. Known keys include required_role, state, limit, max, current, current_status, operation_id, frozen_since. Secrets such as a session token or an invitation code are never placed in the envelope."
              additionalProperties: true
    Role:
      type: string
      enum: [support, admin, owner]
    AccountId: { type: string, pattern: "^acc_[A-Za-z0-9]+$" }
    AdminId: { type: string, pattern: "^adm_[A-Za-z0-9]+$" }
    GrantId: { type: string, pattern: "^grt_[A-Za-z0-9]+$" }
    OperationId: { type: string, pattern: "^opr_[A-Za-z0-9]+$" }
    AuditId: { type: string, pattern: "^aud_[A-Za-z0-9]+$" }
    CredentialId: { type: string, pattern: "^cred_[A-Za-z0-9]+$" }
    Sha256Hex: { type: string, pattern: "^[a-f0-9]{64}$" }
    AccessPurpose:
      type: string
      enum: [support_request, abuse_review, billing_issue, legal_request, security_incident, testing, other]
    Reason:
      type: string
      minLength: 10
      maxLength: 500
      description: |
        Mandatory free text written by the admin. It is stored outside the audit chain (encrypted under a key that is
        destroyed when the target account is deleted); only a salted commitment hash is in the chained row. State the
        category and the facts. Do not enter names, email addresses or other personal data; the server rejects strings
        that look like an email address with `invalid_request`.
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
    RevokeRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        notify_user: { type: boolean, default: true }
    RevokeResult:
      type: object
      required: [account_id, devices_revoked, sessions_revoked, manage_tokens_revoked, operation_id]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        devices_revoked: { type: integer, minimum: 0, maximum: 3 }
        sessions_revoked: { type: integer, minimum: 0 }
        manage_tokens_revoked: { type: integer, minimum: 0 }
        operation_id: { $ref: "#/components/schemas/OperationId" }
    AdminLimits:
      type: object
      description: The configured limits currently in force. Each is at or below its contract ceiling. Budget limits are multiples of the standard Plus window, never literal credits.
      required: [standard_window_credits, grant_max_days, grant_default_percent, grant_max_percent, grant_max_total_percent, grant_max_days_per_account_per_year, grant_max_per_admin_per_day, grant_monthly_cap_windows, deletion_min_cooling_off_hours_non_owner, deletion_max_cooling_off_hours, suspension_max_days, search_distinct_accounts_per_day, user_emails_per_admin_per_hour, stepup_ttl_seconds]
      additionalProperties: false
      properties:
        standard_window_credits: { type: integer, minimum: 1, description: "The credit limit of one standard Plus window (W), from the routing table. Informational." }
        grant_max_days: { type: integer, minimum: 1, maximum: 90 }
        grant_default_percent: { type: integer, minimum: 10, maximum: 200 }
        grant_max_percent: { type: integer, minimum: 10, maximum: 200 }
        grant_max_total_percent: { type: integer, minimum: 10, maximum: 600, description: "Cap on the sum of the window limits of one grant, in percent of W." }
        grant_max_days_per_account_per_year: { type: integer, minimum: 1, maximum: 365 }
        grant_max_per_admin_per_day: { type: integer, minimum: 1, maximum: 100 }
        grant_monthly_cap_windows: { type: integer, minimum: 0, description: "Global cap on the window limits committed to grants starting in a calendar month, in multiples of W." }
        deletion_min_cooling_off_hours_non_owner: { type: integer, minimum: 0, maximum: 72 }
        deletion_max_cooling_off_hours: { type: integer, minimum: 0, maximum: 72 }
        suspension_max_days: { type: integer, minimum: 1, maximum: 365 }
        search_distinct_accounts_per_day: { type: integer, minimum: 1 }
        user_emails_per_admin_per_hour: { type: integer, minimum: 1 }
        stepup_ttl_seconds: { type: integer, const: 300 }
    AdminSession:
      type: object
      required: [admin_id, email, role, expires_at, idle_expires_at, writes_frozen, credentials_count, server_time]
      additionalProperties: false
      properties:
        admin_id: { $ref: "#/components/schemas/AdminId" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time, description: Absolute expiry (8 hours after creation). }
        idle_expires_at: { type: string, format: date-time, description: Idle expiry (30 minutes after the last request). }
        writes_frozen: { type: boolean }
        credentials_count: { type: integer, minimum: 0 }
        server_time: { type: string, format: date-time }
    AdminSessionCreated:
      type: object
      required: [csrf_token, session]
      additionalProperties: false
      properties:
        csrf_token: { type: string, minLength: 20, maxLength: 160, description: "Returned once. Keep it in memory only." }
        session: { $ref: "#/components/schemas/AdminSession" }
    StepUpChallengeRequest:
      type: object
      required: [method, path, body_sha256]
      additionalProperties: false
      properties:
        method: { type: string, const: POST }
        path: { type: string, pattern: "^/admin/v1/", maxLength: 512, description: "The full path of the action, with its query string if any." }
        body_sha256: { $ref: "#/components/schemas/Sha256Hex" }
    StepUpChallenge:
      type: object
      required: [challenge_id, expires_at, public_key_options]
      additionalProperties: false
      properties:
        challenge_id: { type: string, pattern: "^chl_[A-Za-z0-9]+$" }
        expires_at: { type: string, format: date-time }
        public_key_options:
          type: object
          description: WebAuthn PublicKeyCredentialRequestOptions (challenge, rpId, allowCredentials, timeout) with userVerification set to required.
          additionalProperties: true
    Credential:
      type: object
      required: [credential_id, label, created_at, last_used_at]
      additionalProperties: false
      properties:
        credential_id: { $ref: "#/components/schemas/CredentialId" }
        label: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    CredentialList:
      type: object
      required: [credentials]
      additionalProperties: false
      properties:
        credentials:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Credential" }
    CredentialRegistrationStart:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        enrollment_ticket: { type: string, minLength: 20, maxLength: 128, description: "Single-use ticket printed once by the bootstrap script. Used only for the first credential." }
    CredentialRegistrationOptions:
      type: object
      required: [registration_id, expires_at, public_key_options]
      additionalProperties: false
      properties:
        registration_id: { type: string, pattern: "^reg_[A-Za-z0-9]+$" }
        expires_at: { type: string, format: date-time }
        public_key_options:
          type: object
          description: WebAuthn PublicKeyCredentialCreationOptions with user verification required.
          additionalProperties: true
    CredentialRegistrationComplete:
      type: object
      required: [registration_id, attestation, reason]
      additionalProperties: false
      properties:
        registration_id: { type: string, pattern: "^reg_[A-Za-z0-9]+$" }
        attestation:
          type: object
          required: [id, type, client_data_json, attestation_object]
          additionalProperties: false
          properties:
            id: { type: string, maxLength: 1024 }
            type: { type: string, const: public-key }
            client_data_json: { type: string, maxLength: 4096 }
            attestation_object: { type: string, maxLength: 16384 }
        reason: { $ref: "#/components/schemas/Reason" }
    AccountStatus:
      type: string
      description: The account status of the service (see the data table in the cloud plan).
      enum: [active, suspended, deleting]
    AccountSearchRequest:
      type: object
      additionalProperties: false
      description: A key lookup stands alone. A status or plan filter is valid only with a creation window of at most 7 days.
      anyOf:
        - { required: [account_id] }
        - { required: [email] }
        - { required: [email_prefix] }
        - required: [created_from, created_to]
          anyOf:
            - { required: [status] }
            - { required: [plan_id] }
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email: { type: string, maxLength: 254, description: Exact match on the stored email. }
        email_prefix: { type: string, minLength: 6, maxLength: 64 }
        status: { $ref: "#/components/schemas/AccountStatus" }
        plan_id: { $ref: "#/components/schemas/PlanId" }
        created_from: { type: string, format: date-time }
        created_to: { type: string, format: date-time }
        limit: { type: integer, minimum: 1, maximum: 25, default: 25 }
        cursor: { type: string, maxLength: 512 }
    PlanId:
      type: string
      description: "`plus_complimentary` is a window with source `admin_grant`; see the proposed amendments to the public contract."
      enum: [free, plus_monthly, plus_semester, plus_complimentary]
    AccountSummary:
      type: object
      required: [account_id, email_masked, status, plan_id, created_at]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email_masked: { type: string, pattern: "^[^@*]{1,2}\\*\\*\\*@[^@]+$", description: "First two characters of the local part, then ***, then the domain. The full email is revealed only by the audited account read." }
        status: { $ref: "#/components/schemas/AccountStatus" }
        plan_id: { $ref: "#/components/schemas/PlanId" }
        created_at: { type: string, format: date-time }
    AccountSearchResponse:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AccountSummary" }
        next_cursor: { type: [string, "null"] }
    WindowSource:
      type: string
      enum: [paddle_subscription, paddle_pass, admin_grant]
    BudgetWindow:
      type: object
      required: [window_start, window_end, source, grant_id, state, limit, used, reserved]
      additionalProperties: false
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/WindowSource" }
        grant_id: { type: [string, "null"] }
        state: { type: string, enum: [scheduled, active, ended, revoked] }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
    AdminPlan:
      type: object
      required: [id, status, period_start, period_end, cancel_at_period_end, cancel_pending]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        status: { type: string, enum: [none, active, past_due, canceled, revoked] }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        cancel_pending: { type: boolean, description: A cancellation operation is waiting for Paddle. }
    UsageSummary:
      type: object
      description: Counters only. Never content, never per-request text or timing of requests.
      required: [windows]
      additionalProperties: false
      properties:
        windows:
          type: array
          maxItems: 3
          description: The current and the two previous windows.
          items:
            type: object
            required: [window_start, credits_used, requests, credits_by_feature]
            additionalProperties: false
            properties:
              window_start: { type: string, format: date-time }
              credits_used: { type: integer, minimum: 0 }
              requests: { type: integer, minimum: 0 }
              credits_by_feature:
                type: object
                additionalProperties: false
                properties:
                  chat: { type: integer, minimum: 0 }
                  transcription: { type: integer, minimum: 0 }
                  ocr: { type: integer, minimum: 0 }
        daily:
          type: array
          maxItems: 30
          description: Optional. Present only if the retained usage totals have daily granularity (an open item).
          items:
            type: object
            required: [date, requests, credits_used]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              requests: { type: integer, minimum: 0 }
              credits_used: { type: integer, minimum: 0 }
    ConsentSummary:
      type: object
      required: [provider_set, provider_set_version, features, recorded_at]
      additionalProperties: false
      properties:
        provider_set: { type: string, maxLength: 64 }
        provider_set_version: { type: integer, minimum: 1 }
        features: { type: array, items: { type: string, enum: [chat, transcription, ocr] } }
        recorded_at: { type: string, format: date-time }
    BillingRefs:
      type: object
      description: Opaque Paddle ids, for finding the customer in Paddle. Hidden below the admin role.
      required: [paddle_customer_id, paddle_subscription_id, last_event_applied_at]
      additionalProperties: false
      properties:
        paddle_customer_id: { type: [string, "null"] }
        paddle_subscription_id: { type: [string, "null"] }
        last_event_applied_at: { type: [string, "null"], format: date-time }
    SuspensionCategory:
      type: string
      enum: [abuse, chargeback_fraud, terms_violation, security, legal_request, pending_admin_deletion, other]
    StatusDetail:
      type: object
      required: [category, since, expires_at, operation_id]
      additionalProperties: false
      properties:
        category: { $ref: "#/components/schemas/SuspensionCategory" }
        since: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        operation_id: { type: [string, "null"], description: Set when the suspension is the cooling-off period of a deletion. }
    OperationSummary:
      type: object
      required: [operation_id, kind, state]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        kind: { $ref: "#/components/schemas/OperationKind" }
        state: { $ref: "#/components/schemas/OperationState" }
    AdminAccount:
      type: object
      required: [account_id, email, login_methods, status, status_detail, terms_version, created_at, last_sign_in_at, last_request_at, plan, windows, usage, devices_count, consents, billing, pending_operations]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email: { type: string }
        login_methods:
          type: array
          minItems: 1
          items: { type: string, enum: [google, email] }
        status: { $ref: "#/components/schemas/AccountStatus" }
        status_detail:
          oneOf:
            - { $ref: "#/components/schemas/StatusDetail" }
            - { type: "null" }
        terms_version: { type: string }
        created_at: { type: string, format: date-time }
        last_sign_in_at: { type: [string, "null"], format: date-time }
        last_request_at: { type: [string, "null"], format: date-time }
        plan: { $ref: "#/components/schemas/AdminPlan" }
        windows:
          type: array
          description: Past, current and scheduled windows, newest first (at most 12).
          maxItems: 12
          items: { $ref: "#/components/schemas/BudgetWindow" }
        usage: { $ref: "#/components/schemas/UsageSummary" }
        devices_count: { type: integer, minimum: 0, maximum: 3 }
        consents:
          type: array
          items: { $ref: "#/components/schemas/ConsentSummary" }
        billing:
          oneOf:
            - { $ref: "#/components/schemas/BillingRefs" }
            - { type: "null" }
        pending_operations:
          type: array
          items: { $ref: "#/components/schemas/OperationSummary" }
    AdminDevice:
      type: object
      required: [device_id, label, platform, created_at, last_used_at, idle_expires_at, absolute_expires_at]
      additionalProperties: false
      properties:
        device_id: { type: string, pattern: "^dev_[A-Za-z0-9]+$" }
        label: { type: string, maxLength: 64, description: "User-editable text. Always rendered as text by the UI." }
        platform: { type: string, maxLength: 32 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
    AdminDeviceList:
      type: object
      required: [devices]
      additionalProperties: false
      properties:
        devices:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/AdminDevice" }
    GrantReasonCategory:
      type: string
      enum: [trial, beta_tester, support_goodwill, compensation, partner, testing, other]
    GrantCreateRequest:
      type: object
      required: [days, reason, reason_category]
      additionalProperties: false
      properties:
        days: { type: integer, minimum: 1, maximum: 90, description: "Explicit duration. The configured maximum can be lower than the contract ceiling of 90." }
        budget_percent: { type: integer, minimum: 10, maximum: 200, default: 100, description: "Budget of each window as a percent of the standard Plus window (W). Overriding the default of 100 is owner only. Capped by configuration." }
        start_policy: { type: string, enum: [now, after_current_windows], default: now }
        reason: { $ref: "#/components/schemas/Reason" }
        reason_category: { $ref: "#/components/schemas/GrantReasonCategory" }
        note: { type: string, maxLength: 500, description: Optional admin-only note; same content rules as the reason. }
        notify_user: { type: boolean, default: true }
    GrantState:
      type: string
      enum: [scheduled, active, expired, shortened, revoked]
    GrantWindow:
      type: object
      required: [window_start, window_end, limit, used]
      additionalProperties: false
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
    Grant:
      type: object
      required: [grant_id, account_id, state, reason_category, days, starts_at, ends_at, original_ends_at, budget_percent, credits_per_window, credits_cap_total, credits_used, windows, created_by_admin_id, created_at, audit_id, operation_id, note]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
        account_id: { $ref: "#/components/schemas/AccountId" }
        state: { $ref: "#/components/schemas/GrantState" }
        reason_category: { $ref: "#/components/schemas/GrantReasonCategory" }
        days: { type: integer, minimum: 1, maximum: 90 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        original_ends_at: { type: string, format: date-time }
        budget_percent: { type: integer, minimum: 10, maximum: 200 }
        credits_per_window: { type: integer, minimum: 1 }
        credits_cap_total: { type: integer, minimum: 1, description: Sum of the window limits; the cost cap of this grant. }
        credits_used: { type: integer, minimum: 0 }
        windows:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/GrantWindow" }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
        audit_id: { $ref: "#/components/schemas/AuditId" }
        operation_id: { $ref: "#/components/schemas/OperationId" }
        note: { type: [string, "null"] }
    GrantList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        next_cursor: { type: [string, "null"] }
    GrantShortenRequest:
      type: object
      required: [new_ends_at, reason]
      additionalProperties: false
      properties:
        new_ends_at: { type: string, format: date-time, description: Must be after now and before the current end. }
        reason: { $ref: "#/components/schemas/Reason" }
        notify_user: { type: boolean, default: true }
    GrantStats:
      type: object
      required: [standard_window_credits, monthly_cap_windows, monthly_credit_cap, current_month_committed_credits, months]
      additionalProperties: false
      properties:
        standard_window_credits: { type: integer, minimum: 1, description: "W, the credit limit of one standard Plus window." }
        monthly_cap_windows: { type: integer, minimum: 0 }
        monthly_credit_cap: { type: integer, minimum: 0, description: "monthly_cap_windows times W." }
        current_month_committed_credits: { type: integer, minimum: 0, description: "Credits committed to grant windows that start in the current month; a cut or revoked window keeps max(used, committed share)." }
        months:
          type: array
          items:
            type: object
            required: [month, grants_created, credits_granted, credits_used]
            additionalProperties: false
            properties:
              month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              grants_created: { type: integer, minimum: 0 }
              credits_granted: { type: integer, minimum: 0 }
              credits_used: { type: integer, minimum: 0 }
    CancelRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: The user is always notified; there is no notify_user switch for cancellations.
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        note: { type: string, maxLength: 500 }
    OperationKind:
      type: string
      enum: [subscription_cancel, subscription_resume, account_deletion, grant_change, suspension_change, session_revocation]
    OperationState:
      type: string
      description: "pending: waiting for Paddle, a retry or the outbox. cooling_off: deletion not started yet. running: deletion started. held: an execution step was paused (freeze, requester no longer enabled, account state changed) and the owner was alerted. completed, failed (needs an admin), withdrawn, superseded (the user deleted the account first)."
      enum: [pending, cooling_off, running, held, completed, failed, withdrawn, superseded]
    OperationErrorCode:
      type: string
      description: Fixed codes only, never provider text.
      enum: [paddle_unavailable, paddle_rejected, paddle_not_found, timeout, internal_error]
    HoldReason:
      type: string
      enum: [freeze, requester_disabled, account_state_changed]
    Operation:
      type: object
      required: [operation_id, kind, account_id, state, effective_from, executes_at, overdue, hold_reason, attempts, last_error_code, next_retry_at, requested_by_admin_id, created_at, updated_at, audit_id]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        kind: { $ref: "#/components/schemas/OperationKind" }
        account_id: { $ref: "#/components/schemas/AccountId" }
        state: { $ref: "#/components/schemas/OperationState" }
        effective_from: { type: [string, "null"], enum: [period_end, immediately, null], description: Cancellations only. }
        executes_at: { type: [string, "null"], format: date-time, description: End of the cooling-off period for a deletion. }
        overdue: { type: boolean, description: "A deletion is past executes_at and not running; an owner alert was sent." }
        hold_reason:
          oneOf:
            - { $ref: "#/components/schemas/HoldReason" }
            - { type: "null" }
        attempts: { type: integer, minimum: 0 }
        last_error_code:
          oneOf:
            - { $ref: "#/components/schemas/OperationErrorCode" }
            - { type: "null" }
        next_retry_at: { type: [string, "null"], format: date-time }
        requested_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        audit_id: { $ref: "#/components/schemas/AuditId" }
    OperationList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
        next_cursor: { type: [string, "null"] }
    SuspendRequest:
      type: object
      required: [reason, reason_category]
      additionalProperties: false
      description: The user is always notified; there is no notify_user switch for a suspension.
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        reason_category:
          type: string
          enum: [abuse, chargeback_fraud, terms_violation, security, legal_request, other]
        duration_days: { type: integer, minimum: 1, maximum: 365, description: Omit for no end date. The configured maximum can be lower. }
        cancel_subscription: { type: string, enum: [none, period_end, immediately], default: none, description: "Also cancel the Paddle subscription as part of this one step-up-covered action." }
        blocklist: { type: boolean, default: false, x-phase: later, description: "Later phase; rejected with invalid_request in the first cut. The UI defaults it on for the fraud category." }
        blocklist_days: { type: integer, minimum: 1, maximum: 730, x-phase: later, description: "Later phase. Expiry of the blocklist entries; omit for the configured default." }
    UnsuspendRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        remove_blocklist: { type: boolean, default: false, x-phase: later }
        notify_user: { type: boolean, default: true }
    SuspensionResult:
      type: object
      required: [account_id, status, expires_at, sessions_revoked, manage_tokens_revoked, blocklist_entry_ids, operation_id]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        expires_at: { type: [string, "null"], format: date-time }
        sessions_revoked: { type: integer, minimum: 0 }
        manage_tokens_revoked: { type: integer, minimum: 0 }
        blocklist_entry_ids:
          type: array
          items: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
        operation_id: { $ref: "#/components/schemas/OperationId" }
    BlocklistEntry:
      type: object
      required: [entry_id, kind, key_id, state, created_at, expires_at, created_by_admin_id, reason_category, audit_id]
      additionalProperties: false
      properties:
        entry_id: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
        kind: { type: string, enum: [email, google_subject] }
        key_id: { type: string, pattern: "^bk[0-9]+$", description: Version of the key under which the hash was computed. }
        state: { type: string, enum: [active, expired, removed] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        reason_category: { $ref: "#/components/schemas/SuspensionCategory" }
        audit_id: { $ref: "#/components/schemas/AuditId" }
    BlocklistList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BlocklistEntry" }
        next_cursor: { type: [string, "null"] }
    DeletionRequest:
      type: object
      required: [reason, confirm_account_id]
      additionalProperties: false
      description: The completion email is always sent; send_heads_up controls only the notice at the time of the request.
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        confirm_account_id: { $ref: "#/components/schemas/AccountId" }
        cooling_off_hours: { type: integer, minimum: 0, maximum: 72, default: 24, description: "0 is owner only; anyone else has a configured minimum." }
        send_heads_up: { type: boolean, default: true }
    CompleteManuallyRequest:
      type: object
      required: [reason, confirm_cancelled_in_paddle]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        confirm_cancelled_in_paddle: { type: boolean, const: true }
    Admin:
      type: object
      required: [admin_id, email, role, status, created_at, created_by_admin_id, last_seen_at, disabled_at]
      additionalProperties: false
      properties:
        admin_id: { $ref: "#/components/schemas/AdminId" }
        email: { type: [string, "null"], description: Null once the admin is removed. }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, disabled, removed] }
        created_at: { type: string, format: date-time }
        created_by_admin_id: { type: [string, "null"], description: Null for the bootstrap owner. }
        last_seen_at: { type: [string, "null"], format: date-time }
        disabled_at: { type: [string, "null"], format: date-time }
    AdminList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Admin" }
        next_cursor: { type: [string, "null"] }
    InvitationCreateRequest:
      type: object
      required: [email, role, reason]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: "#/components/schemas/Role" }
        reason: { $ref: "#/components/schemas/Reason" }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    Invitation:
      type: object
      description: The code is emailed to the invited address and is never part of any response.
      required: [invitation_id, email, role, state, expires_at, created_by_admin_id, created_at]
      additionalProperties: false
      properties:
        invitation_id: { type: string, pattern: "^inv_[A-Za-z0-9]+$" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { type: string, enum: [pending, accepted, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_cursor: { type: [string, "null"] }
    InvitationAcceptRequest:
      type: object
      required: [invitation_code]
      additionalProperties: false
      properties:
        invitation_code: { type: string, minLength: 12, maxLength: 12, pattern: "^[A-HJ-NP-Z2-9]{12}$" }
    RoleChangeRequest:
      type: object
      required: [role, reason]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
        reason: { $ref: "#/components/schemas/Reason" }
    AuditAction:
      type: string
      enum:
        - admin.session_start
        - admin.session_end
        - admin.bootstrap
        - admin.disable
        - admin.enable
        - admin.remove
        - admin.invitation_accept
        - admin.invitation_revoke
        - account.devices_read
        - grant.stats_read
        - account.suspension_expire
        - grant.expire
        - account.search
        - account.read
        - grant.create
        - grant.read
        - grant.shorten
        - grant.revoke
        - subscription.cancel_at_period_end
        - subscription.cancel_immediately
        - subscription.resume
        - operation.retry
        - operation.withdraw
        - operation.complete_manually
        - operation.read
        - operation.step
        - account.delete_execute
        - admin.credential_register
        - admin.credential_remove
        - operation.hold
        - account.suspend
        - account.unsuspend
        - account.delete_request
        - device.revoke
        - sessions.revoke_all
        - blocklist.add
        - blocklist.remove
        - admin.invite
        - admin.role_change
        - system.freeze
        - system.unfreeze
        - system.auto_freeze
        - grant.list
        - operation.list
        - audit.list
        - credential.list
        - admin.list
        - invitation.list
        - blocklist.list
        - audit.export
        - audit.verify
        - audit.denied_overflow
        - retention.checkpoint
        - audit.reconcile
    AuditResult:
      type: string
      enum: [success, denied, failed, pending]
    ParamsNone: { type: object, additionalProperties: false, maxProperties: 0 }
    ParamsSearch:
      type: object
      required: [query_kind, query_hmac, result_count]
      additionalProperties: false
      properties:
        query_kind: { type: string, enum: [email, email_prefix, account_id, filter] }
        query_hmac: { $ref: "#/components/schemas/Sha256Hex" }
        result_count: { type: integer, minimum: 0, maximum: 25 }
    ParamsAccountRead:
      type: object
      required: [purpose]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/AccessPurpose" }
    ParamsGrantCreate:
      type: object
      required: [grant_id, operation_id, days, budget_percent, start_policy, reason_category]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
        operation_id: { $ref: "#/components/schemas/OperationId" }
        days: { type: integer, minimum: 1, maximum: 90 }
        budget_percent: { type: integer, minimum: 10, maximum: 200 }
        start_policy: { type: string, enum: [now, after_current_windows] }
        reason_category: { $ref: "#/components/schemas/GrantReasonCategory" }
    ParamsGrantRef:
      type: object
      required: [grant_id]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
    ParamsGrantShorten:
      type: object
      required: [grant_id, operation_id, new_ends_at]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
        operation_id: { $ref: "#/components/schemas/OperationId" }
        new_ends_at: { type: string, format: date-time }
    ParamsGrantRevoke:
      type: object
      required: [grant_id, operation_id, released_credits]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
        operation_id: { $ref: "#/components/schemas/OperationId" }
        released_credits: { type: integer, minimum: 0 }
    ParamsOperationRef:
      type: object
      required: [operation_id]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
    ParamsOperationStep:
      type: object
      required: [operation_id, step, outcome]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        step: { type: string, enum: [account_object, database, paddle, erase, notify, expire] }
        outcome: { type: string, enum: [ok, retry, failed] }
    ParamsOperationHold:
      type: object
      required: [operation_id, hold_reason]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        hold_reason: { $ref: "#/components/schemas/HoldReason" }
    ParamsSuspend:
      type: object
      required: [operation_id, reason_category, blocklist, cancel_subscription]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        reason_category: { $ref: "#/components/schemas/SuspensionCategory" }
        duration_days: { type: [integer, "null"], minimum: 1, maximum: 365 }
        blocklist: { type: boolean }
        cancel_subscription: { type: string, enum: [none, period_end, immediately] }
    ParamsUnsuspend:
      type: object
      required: [operation_id, removed_blocklist]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        removed_blocklist: { type: boolean }
    ParamsDeletion:
      type: object
      required: [operation_id, cooling_off_hours, send_heads_up]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        cooling_off_hours: { type: integer, minimum: 0, maximum: 72 }
        send_heads_up: { type: boolean }
    ParamsDeviceRevoke:
      type: object
      required: [operation_id, device_id]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        device_id: { type: string, pattern: "^dev_[A-Za-z0-9]+$" }
    ParamsSessionsRevoke:
      type: object
      required: [operation_id, sessions_revoked, manage_tokens_revoked]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        sessions_revoked: { type: integer, minimum: 0 }
        manage_tokens_revoked: { type: integer, minimum: 0 }
    ParamsBlocklistAdd:
      type: object
      required: [entry_id, kind, key_id]
      additionalProperties: false
      properties:
        entry_id: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
        kind: { type: string, enum: [email, google_subject] }
        key_id: { type: string, pattern: "^bk[0-9]+$" }
    ParamsBlocklistRef:
      type: object
      required: [entry_id]
      additionalProperties: false
      properties:
        entry_id: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
    ParamsInvite:
      type: object
      required: [invitation_id, role]
      additionalProperties: false
      properties:
        invitation_id: { type: string, pattern: "^inv_[A-Za-z0-9]+$" }
        role: { $ref: "#/components/schemas/Role" }
    ParamsRoleChange:
      type: object
      required: [from_role, to_role]
      additionalProperties: false
      properties:
        from_role: { $ref: "#/components/schemas/Role" }
        to_role: { $ref: "#/components/schemas/Role" }
    ParamsFreeze:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: { type: string, enum: [manual, auto, platform_override] }
    ParamsAutoFreeze:
      type: object
      required: [trigger, count, window_minutes]
      additionalProperties: false
      properties:
        trigger: { type: string, enum: [destructive_actions, write_actions] }
        count: { type: integer, minimum: 1 }
        window_minutes: { type: integer, minimum: 1 }
    ParamsCount:
      type: object
      required: [result_count]
      additionalProperties: false
      properties:
        result_count: { type: integer, minimum: 0, maximum: 200 }
    ParamsCredential:
      type: object
      required: [credential_id]
      additionalProperties: false
      properties:
        credential_id: { $ref: "#/components/schemas/CredentialId" }
    ParamsExport:
      type: object
      required: [from_seq, to_seq, rows]
      additionalProperties: false
      properties:
        from_seq: { type: integer, minimum: 1 }
        to_seq: { type: integer, minimum: 1 }
        rows: { type: integer, minimum: 0 }
    ParamsVerify:
      type: object
      required: [rows_checked, anchors_checked, ok]
      additionalProperties: false
      properties:
        rows_checked: { type: integer, minimum: 0 }
        anchors_checked: { type: integer, minimum: 0 }
        ok: { type: boolean }
    ParamsOverflow:
      type: object
      required: [suppressed_count, window_start]
      additionalProperties: false
      properties:
        suppressed_count: { type: integer, minimum: 1 }
        window_start: { type: string, format: date-time }
    ParamsRetention:
      type: object
      required: [first_seq, last_seq, last_removed_hash]
      additionalProperties: false
      properties:
        first_seq: { type: integer, minimum: 1 }
        last_seq: { type: integer, minimum: 1 }
        last_removed_hash: { $ref: "#/components/schemas/Sha256Hex" }
    ParamsReconcile:
      type: object
      required: [intent_audit_id, resolved_as]
      additionalProperties: false
      properties:
        intent_audit_id: { $ref: "#/components/schemas/AuditId" }
        resolved_as: { type: string, enum: [success, failed] }
    AuditRow:
      type: object
      description: |
        Append-only and chained. `row_hash` is an HMAC-SHA-256, under a key only the audit-writer Worker holds, over
        `prev_hash`, a newline and the RFC 8785 canonical JSON of the row without `row_hash`, `reason_text` and
        `reason_state` (those two are not part of the chain). `chain_version` and an environment id (in the genesis
        hash) separate versions and environments. There is deliberately no field for an IP address, a user agent,
        content, a token or a code, and no email address. `params` is one of the per-action schemas below, each with
        `additionalProperties: false`. `session_ref` is an HMAC of the admin session id (it links the rows of one
        browser session without any network identifier); `country` is an optional coarse country, off by default.
      required: [audit_id, seq, chain_version, occurred_at, actor_kind, actor_admin_id, actor_role, action, target_account_id, target_admin_id, reason_commitment, reason_text, reason_state, request_id, session_ref, country, result, result_code, params, prev_hash, row_hash]
      additionalProperties: false
      properties:
        audit_id: { $ref: "#/components/schemas/AuditId" }
        seq: { type: integer, minimum: 1 }
        chain_version: { type: integer, const: 1 }
        occurred_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [admin, system, unregistered] }
        actor_admin_id: { type: [string, "null"] }
        actor_role:
          oneOf:
            - { $ref: "#/components/schemas/Role" }
            - { type: "null" }
        action: { $ref: "#/components/schemas/AuditAction" }
        target_account_id: { type: [string, "null"] }
        target_admin_id: { type: [string, "null"] }
        reason_commitment:
          oneOf:
            - { $ref: "#/components/schemas/Sha256Hex" }
            - { type: "null" }
        reason_text: { type: [string, "null"], maxLength: 500, description: "Not part of the chain. Null once erased." }
        reason_state: { type: string, enum: [present, erased, none], description: "Not part of the chain." }
        request_id: { type: string, maxLength: 64 }
        session_ref:
          oneOf:
            - { $ref: "#/components/schemas/Sha256Hex" }
            - { type: "null" }
        country: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        result: { $ref: "#/components/schemas/AuditResult" }
        result_code:
          oneOf:
            - { $ref: "#/components/schemas/ErrorCode" }
            - { type: "null" }
        params:
          oneOf:
            - { $ref: "#/components/schemas/ParamsNone" }
            - { $ref: "#/components/schemas/ParamsSearch" }
            - { $ref: "#/components/schemas/ParamsAccountRead" }
            - { $ref: "#/components/schemas/ParamsGrantCreate" }
            - { $ref: "#/components/schemas/ParamsGrantRef" }
            - { $ref: "#/components/schemas/ParamsGrantShorten" }
            - { $ref: "#/components/schemas/ParamsGrantRevoke" }
            - { $ref: "#/components/schemas/ParamsOperationRef" }
            - { $ref: "#/components/schemas/ParamsOperationStep" }
            - { $ref: "#/components/schemas/ParamsCredential" }
            - { $ref: "#/components/schemas/ParamsOperationHold" }
            - { $ref: "#/components/schemas/ParamsSuspend" }
            - { $ref: "#/components/schemas/ParamsUnsuspend" }
            - { $ref: "#/components/schemas/ParamsDeletion" }
            - { $ref: "#/components/schemas/ParamsDeviceRevoke" }
            - { $ref: "#/components/schemas/ParamsSessionsRevoke" }
            - { $ref: "#/components/schemas/ParamsBlocklistAdd" }
            - { $ref: "#/components/schemas/ParamsBlocklistRef" }
            - { $ref: "#/components/schemas/ParamsInvite" }
            - { $ref: "#/components/schemas/ParamsRoleChange" }
            - { $ref: "#/components/schemas/ParamsFreeze" }
            - { $ref: "#/components/schemas/ParamsAutoFreeze" }
            - { $ref: "#/components/schemas/ParamsCount" }
            - { $ref: "#/components/schemas/ParamsExport" }
            - { $ref: "#/components/schemas/ParamsVerify" }
            - { $ref: "#/components/schemas/ParamsOverflow" }
            - { $ref: "#/components/schemas/ParamsRetention" }
            - { $ref: "#/components/schemas/ParamsReconcile" }
        prev_hash: { $ref: "#/components/schemas/Sha256Hex" }
        row_hash: { $ref: "#/components/schemas/Sha256Hex" }
      allOf:
        - if:
            properties:
              action: { enum: [admin.session_start, admin.session_end, admin.bootstrap, admin.disable, admin.enable, admin.remove, admin.invitation_accept, admin.invitation_revoke, account.devices_read, grant.stats_read, account.suspension_expire, grant.expire] }
            required: [action]
          then:
            properties:
              params: { $ref: "#/components/schemas/ParamsNone" }
        - if:
            properties:
              action: { enum: [account.search] }
            required: [action]
          then:
            properties:
              params: { $ref: "#/components/schemas/ParamsSearch" }
        - if:
            properties:
              action: { enum: [account.read] }
            required: [action]
          then:
            properties:
              params: { $ref: "#/components/schemas/ParamsAccountRead" }
        - if:
            properties:
              action: { enum: [grant.create] }
            required: [action]
          then:
            properties:
              params: { $ref: "#/components/schemas/ParamsGrantCreate" }
        - if:
            properties:
              action: { enum: [grant.read] }
            required: [action]
          then:
