  /admin/v1/accounts/{account_id}/deletion:
    post:
      tags: [moderation]
      operationId: requestAccountDeletion
      summary: Delete an account (with an optional cooling-off period)
      description: |
        Needs a fresh re-authentication, a mandatory reason and `confirm_account_id` equal to the path id
        (`confirmation_mismatch` otherwise; the UI also makes the admin type the id). With
        `cooling_off_hours` above 0 the account is first placed in `suspended` (so it cannot be used, while the
        data-rights routes still work and the user can export or delete the account themselves) and the
        operation is `cooling_off` until `executes_at`; it can be withdrawn until then. At execution, and
        immediately when `cooling_off_hours` is 0, the shared deletion domain function runs: tombstone `deleting`
        keeping only the Paddle ids, cancel at Paddle immediately (retry with backoff and an owner alert),
        purge everything else once the cancel succeeded, final notification email. The user also gets a
        heads-up email when the request is made unless `notify_user` is false. Notifies the owners. Cannot target
        the acting admin's own user account.
      x-required-role: admin
      x-requires-fresh-auth: true
      x-destructive: true
      x-audit-action: account.delete_request
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
