        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Recompute the hash chain and compare it with the external anchors
      description: Owner only. Reports whether the chain is intact, the head, and the first broken sequence number if any. Writes an `audit.verify` row.
      x-required-role: owner
      x-audit-action: audit.verify
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        The Access-issued JWT. The admin service verifies it itself: pinned signature algorithm, keys from the
        Access team's JWKS (cached with `kid`), exact issuer, audience equal to the admin application's AUD tag
        (never any other Access application), expiry and not-before. The verified `email` claim is mapped to an
        admin record by exact match. A request without a valid JWT is rejected even if the gate is
        misconfigured. A StudentLLM access token or a manage token is never accepted here, and this JWT is never
        accepted by the public API.
  parameters:
    CsrfHeader:
      name: X-StudentLLM-Admin-CSRF
      in: header
      required: true
      description: |
        CSRF token returned by `GET /admin/v1/session`, bound to the session. Required on every POST. The
        service also requires `Origin` equal to the admin hostname, `Sec-Fetch-Site: same-origin` and
        `Content-Type: application/json`; there is no CORS. Failure gives `csrf_invalid`.
      schema: { type: string, minLength: 20, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client UUID, scoped per admin and route, valid 24 hours. Admin requests carry no user content, so the
        record includes a SHA-256 of the canonical body. Same key and same body: the original status and body
        are returned again with `Idempotent-Replay: true` and nothing runs twice. Same key while the first call
        is running: 409 `idempotency_conflict` with `details.state = in_progress`. Same key with a different
        body: 409 `idempotency_conflict` with `details.state = payload_mismatch`. Only calls that reached the
        domain function are recorded, so a request rejected for validation, role or freeze can be retried with
        the same key after it is fixed.
      schema: { type: string, format: uuid }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AccountId" }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, pattern: "^dev_[A-Za-z0-9]+$" }
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/GrantId" }
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OperationId" }
    BlocklistEntryId:
      name: entry_id
      in: path
      required: true
      schema: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, pattern: "^inv_[A-Za-z0-9]+$" }
    AdminId:
      name: admin_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AdminId" }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 100 (25 for account search).
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`.
      schema: { type: string, maxLength: 512 }
  responses:
    BadRequest:
      description: invalid_request, confirmation_mismatch or invitation_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: invalid_access_token or reauth_required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: admin_not_registered, admin_disabled, forbidden_role, self_action_forbidden or csrf_invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: idempotency_conflict, state_conflict, window_overlap or last_owner_protected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: limit_exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: rate_limited.
      headers:
        Retry-After: { schema: { type: integer, minimum: 0 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: admin_writes_frozen, audit_unavailable or internal_error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_access_token
        - reauth_required
        - admin_not_registered
        - admin_disabled
        - forbidden_role
        - self_action_forbidden
        - csrf_invalid
        - not_found
        - idempotency_conflict
        - state_conflict
        - window_overlap
        - last_owner_protected
        - limit_exceeded
        - confirmation_mismatch
        - invitation_invalid
        - rate_limited
        - admin_writes_frozen
        - audit_unavailable
        - internal_error
    Error:
      type: object
      description: The one error envelope. Never contains content, secrets, tokens or provider text.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string }
            retry_after_seconds: { type: integer, minimum: 0 }
            details:
              type: object
              description: "Small structured hints. Known keys include required_role, state, limit, max, current_status, max_age_seconds, operation_id. Secrets such as a CSRF token or an invitation code are never placed in the envelope."
              additionalProperties: true
    Role:
      type: string
      enum: [support, admin, owner]
    AccountId: { type: string, pattern: "^acc_[A-Za-z0-9]+$" }
    AdminId: { type: string, pattern: "^adm_[A-Za-z0-9]+$" }
    GrantId: { type: string, pattern: "^grt_[A-Za-z0-9]+$" }
    OperationId: { type: string, pattern: "^opr_[A-Za-z0-9]+$" }
    AuditId: { type: string, pattern: "^aud_[A-Za-z0-9]+$" }
    Sha256Hex: { type: string, pattern: "^[a-f0-9]{64}$" }
    Reason:
      type: string
      minLength: 10
      maxLength: 500
      description: |
        Mandatory free text written by the admin. It is stored in the audit row. It must not contain course
        content, a prompt, an answer or an email address (the server rejects strings that look like an email
        address with `invalid_request`); use a ticket reference instead.
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
    RevokeRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        notify_user: { type: boolean, default: true }
    RevokeResult:
      type: object
      required: [account_id, devices_revoked, sessions_revoked, manage_tokens_revoked]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        devices_revoked: { type: integer, minimum: 0, maximum: 3 }
        sessions_revoked: { type: integer, minimum: 0 }
        manage_tokens_revoked: { type: integer, minimum: 0 }
    AdminLimits:
      type: object
      description: The configured limits currently in force. Each is at or below its contract ceiling.
      required: [grant_max_days, grant_default_credits_per_window, grant_max_credits_per_window, grant_max_total_credits, grant_max_days_per_account_per_year, grant_monthly_credit_cap, deletion_max_cooling_off_hours, suspension_max_days, reauth_max_age_seconds]
      additionalProperties: false
      properties:
        grant_max_days: { type: integer, minimum: 1, maximum: 90 }
        grant_default_credits_per_window: { type: integer, minimum: 1, maximum: 25000 }
        grant_max_credits_per_window: { type: integer, minimum: 1, maximum: 25000 }
        grant_max_total_credits: { type: integer, minimum: 1, maximum: 75000 }
        grant_max_days_per_account_per_year: { type: integer, minimum: 1, maximum: 365 }
        grant_monthly_credit_cap: { type: integer, minimum: 0 }
        deletion_max_cooling_off_hours: { type: integer, minimum: 0, maximum: 72 }
        suspension_max_days: { type: integer, minimum: 1, maximum: 365 }
        reauth_max_age_seconds: { type: integer, const: 300 }
    AdminSession:
      type: object
      required: [admin_id, email, role, csrf_token, reauth_fresh_until, writes_frozen, server_time]
      additionalProperties: false
      properties:
        admin_id: { $ref: "#/components/schemas/AdminId" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        csrf_token: { type: string, minLength: 20, maxLength: 128, description: "Bound to this session; keep in memory only." }
        reauth_fresh_until: { type: [string, "null"], format: date-time, description: "End of the 5-minute freshness window, or null when the last re-authentication is older." }
        writes_frozen: { type: boolean }
        server_time: { type: string, format: date-time }
    ReauthStart:
      type: object
      required: [reauth_url, expires_at]
      additionalProperties: false
      properties:
        reauth_url: { type: string }
        expires_at: { type: string, format: date-time }
    SystemState:
      type: object
      required: [writes_frozen, frozen_at, frozen_by_admin_id, limits, audit_head_seq, audit_head_hash]
      additionalProperties: false
      properties:
        writes_frozen: { type: boolean }
        frozen_at: { type: [string, "null"], format: date-time }
        frozen_by_admin_id: { type: [string, "null"] }
        limits: { $ref: "#/components/schemas/AdminLimits" }
        audit_head_seq: { type: integer, minimum: 0 }
        audit_head_hash: { $ref: "#/components/schemas/Sha256Hex" }
    AccountStatus:
      type: string
      description: The account status of the service (see the data table in the cloud plan).
      enum: [active, suspended, deleting]
    AccountSearchRequest:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [account_id] }
        - { required: [email] }
        - { required: [email_prefix] }
        - { required: [status] }
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email: { type: string, maxLength: 254, description: "Exact match on the stored email." }
        email_prefix: { type: string, minLength: 6, maxLength: 64 }
        status: { $ref: "#/components/schemas/AccountStatus" }
        plan_id: { $ref: "#/components/schemas/PlanId" }
        limit: { type: integer, minimum: 1, maximum: 25, default: 25 }
        cursor: { type: string, maxLength: 512 }
    PlanId:
      type: string
      description: "`plus_complimentary` is internal to the admin surface for a window with source `admin_grant` (see the design document for the public-contract question)."
      enum: [free, plus_monthly, plus_semester, plus_complimentary]
    AccountSummary:
      type: object
      required: [account_id, email, status, plan_id, created_at]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        plan_id: { $ref: "#/components/schemas/PlanId" }
        created_at: { type: string, format: date-time }
    AccountSearchResponse:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AccountSummary" }
        next_cursor: { type: [string, "null"] }
    WindowSource:
      type: string
      enum: [paddle_subscription, paddle_pass, admin_grant]
    BudgetWindow:
      type: object
      required: [window_start, window_end, source, grant_id, state, limit, used, reserved]
      additionalProperties: false
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/WindowSource" }
        grant_id: { type: [string, "null"] }
        state: { type: string, enum: [scheduled, active, ended, revoked] }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
    AdminPlan:
      type: object
      required: [id, status, period_start, period_end, cancel_at_period_end, cancel_pending]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        status: { type: string, enum: [none, active, past_due, canceled, revoked] }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        cancel_pending: { type: boolean, description: "A cancellation operation is waiting for Paddle." }
    UsageSummary:
      type: object
      description: Counters only. Never content, never per-request text or timing of requests.
      required: [windows]
      additionalProperties: false
      properties:
        windows:
          type: array
          maxItems: 3
          description: The current and the two previous windows.
          items:
            type: object
            required: [window_start, credits_used, requests, credits_by_feature]
            additionalProperties: false
            properties:
              window_start: { type: string, format: date-time }
              credits_used: { type: integer, minimum: 0 }
              requests: { type: integer, minimum: 0 }
              credits_by_feature:
                type: object
                additionalProperties: false
                properties:
                  chat: { type: integer, minimum: 0 }
                  transcription: { type: integer, minimum: 0 }
                  ocr: { type: integer, minimum: 0 }
        daily:
          type: array
          maxItems: 30
          description: Optional. Present only if the retained usage totals have daily granularity (an open item).
          items:
            type: object
            required: [date, requests, credits_used]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              requests: { type: integer, minimum: 0 }
              credits_used: { type: integer, minimum: 0 }
    ConsentSummary:
      type: object
      required: [provider_set, provider_set_version, features, recorded_at]
      additionalProperties: false
      properties:
        provider_set: { type: string }
        provider_set_version: { type: integer, minimum: 1 }
        features: { type: array, items: { type: string, enum: [chat, transcription, ocr] } }
        recorded_at: { type: string, format: date-time }
    BillingRefs:
      type: object
      description: Opaque Paddle ids, for finding the customer in Paddle. Hidden from the `support` role.
      required: [paddle_customer_id, paddle_subscription_id, last_event_applied_at]
      additionalProperties: false
      properties:
        paddle_customer_id: { type: [string, "null"] }
        paddle_subscription_id: { type: [string, "null"] }
        last_event_applied_at: { type: [string, "null"], format: date-time }
    StatusDetail:
      type: object
      required: [category, since, expires_at, operation_id]
      additionalProperties: false
      properties:
        category: { $ref: "#/components/schemas/SuspensionCategory" }
        since: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        operation_id: { type: [string, "null"], description: "Set when the suspension is the cooling-off period of a deletion." }
    OperationSummary:
      type: object
      required: [operation_id, kind, state]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        kind: { $ref: "#/components/schemas/OperationKind" }
        state: { $ref: "#/components/schemas/OperationState" }
    AdminAccount:
      type: object
      required: [account_id, email, login_methods, status, status_detail, terms_version, created_at, last_sign_in_at, last_request_at, plan, windows, usage, devices_count, consents, billing, pending_operations]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        email: { type: string }
        login_methods:
          type: array
          minItems: 1
          items: { type: string, enum: [google, email] }
        status: { $ref: "#/components/schemas/AccountStatus" }
        status_detail:
          oneOf:
            - { $ref: "#/components/schemas/StatusDetail" }
            - { type: "null" }
        terms_version: { type: string }
        created_at: { type: string, format: date-time }
        last_sign_in_at: { type: [string, "null"], format: date-time }
        last_request_at: { type: [string, "null"], format: date-time }
        plan: { $ref: "#/components/schemas/AdminPlan" }
        windows:
          type: array
          description: Past, current and scheduled windows, newest first (at most 12).
          maxItems: 12
          items: { $ref: "#/components/schemas/BudgetWindow" }
        usage: { $ref: "#/components/schemas/UsageSummary" }
        devices_count: { type: integer, minimum: 0, maximum: 3 }
        consents:
          type: array
          items: { $ref: "#/components/schemas/ConsentSummary" }
        billing:
          oneOf:
            - { $ref: "#/components/schemas/BillingRefs" }
            - { type: "null" }
        pending_operations:
          type: array
          items: { $ref: "#/components/schemas/OperationSummary" }
    AdminDevice:
      type: object
      required: [device_id, label, platform, created_at, last_used_at, idle_expires_at, absolute_expires_at]
      additionalProperties: false
      properties:
        device_id: { type: string, pattern: "^dev_[A-Za-z0-9]+$" }
        label: { type: string, maxLength: 64, description: "User-editable text. Always rendered as text by the UI." }
        platform: { type: string, maxLength: 32 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
    AdminDeviceList:
      type: object
      required: [devices]
      additionalProperties: false
      properties:
        devices:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/AdminDevice" }
    GrantReasonCategory:
      type: string
      enum: [trial, beta_tester, support_goodwill, compensation, partner, testing, other]
    GrantCreateRequest:
      type: object
      required: [days, reason, reason_category]
      additionalProperties: false
      properties:
        days: { type: integer, minimum: 1, maximum: 90, description: "Explicit duration. The configured maximum can be lower than the contract ceiling of 90." }
        credit_budget_per_window: { type: integer, minimum: 1, maximum: 25000, description: "Optional override of the credits per window. Defaults to the standard Plus window limit; capped by configuration." }
        start_policy: { type: string, enum: [now, after_current_windows], default: now }
        reason: { $ref: "#/components/schemas/Reason" }
        reason_category: { $ref: "#/components/schemas/GrantReasonCategory" }
        note: { type: string, maxLength: 500, description: "Optional admin-only note; same content rules as the reason." }
        notify_user: { type: boolean, default: true }
    GrantState:
      type: string
      enum: [scheduled, active, expired, shortened, revoked]
    GrantWindow:
      type: object
      required: [window_start, window_end, limit, used]
      additionalProperties: false
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
    Grant:
      type: object
      required: [grant_id, account_id, state, reason_category, days, starts_at, ends_at, original_ends_at, credits_per_window, credits_cap_total, credits_used, windows, created_by_admin_id, created_at, audit_id, note]
      additionalProperties: false
      properties:
        grant_id: { $ref: "#/components/schemas/GrantId" }
        account_id: { $ref: "#/components/schemas/AccountId" }
        state: { $ref: "#/components/schemas/GrantState" }
        reason_category: { $ref: "#/components/schemas/GrantReasonCategory" }
        days: { type: integer, minimum: 1, maximum: 90 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        original_ends_at: { type: string, format: date-time }
        credits_per_window: { type: integer, minimum: 1 }
        credits_cap_total: { type: integer, minimum: 1, description: "Sum of the window limits; the cost cap of this grant." }
        credits_used: { type: integer, minimum: 0 }
        windows:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/GrantWindow" }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
        audit_id: { $ref: "#/components/schemas/AuditId" }
        note: { type: [string, "null"] }
    GrantList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        next_cursor: { type: [string, "null"] }
    GrantShortenRequest:
      type: object
      required: [new_ends_at, reason]
      additionalProperties: false
      properties:
        new_ends_at: { type: string, format: date-time, description: "Must be after now and before the current end." }
        reason: { $ref: "#/components/schemas/Reason" }
        notify_user: { type: boolean, default: true }
    GrantStats:
      type: object
      required: [months, monthly_credit_cap, current_month_committed_credits]
      additionalProperties: false
      properties:
        monthly_credit_cap: { type: integer, minimum: 0 }
        current_month_committed_credits: { type: integer, minimum: 0, description: "Credits of all grant windows that start in the current month, counted at their full limit." }
        months:
          type: array
          items:
            type: object
            required: [month, grants_created, credits_granted, credits_used]
            additionalProperties: false
            properties:
              month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              grants_created: { type: integer, minimum: 0 }
              credits_granted: { type: integer, minimum: 0 }
              credits_used: { type: integer, minimum: 0 }
    CancelRequest:
      type: object
      required: [effective_from, reason]
      additionalProperties: false
      properties:
        effective_from: { type: string, enum: [period_end, immediately] }
        reason: { $ref: "#/components/schemas/Reason" }
        note: { type: string, maxLength: 500 }
        notify_user: { type: boolean, default: true }
    OperationKind:
      type: string
      enum: [subscription_cancel, account_deletion]
    OperationState:
      type: string
      description: "pending: waiting for Paddle or a retry. cooling_off: deletion not started yet. running: deletion started. completed, failed (needs an admin), withdrawn."
      enum: [pending, cooling_off, running, completed, failed, withdrawn]
    OperationErrorCode:
      type: string
      description: Fixed codes only, never provider text.
      enum: [paddle_unavailable, paddle_rejected, paddle_not_found, timeout, internal_error]
    Operation:
      type: object
      required: [operation_id, kind, account_id, state, effective_from, executes_at, attempts, last_error_code, next_retry_at, requested_by_admin_id, created_at, updated_at, audit_id]
      additionalProperties: false
      properties:
        operation_id: { $ref: "#/components/schemas/OperationId" }
        kind: { $ref: "#/components/schemas/OperationKind" }
        account_id: { $ref: "#/components/schemas/AccountId" }
        state: { $ref: "#/components/schemas/OperationState" }
        effective_from: { type: [string, "null"], enum: [period_end, immediately, null], description: "Cancellations only." }
        executes_at: { type: [string, "null"], format: date-time, description: "End of the cooling-off period for a deletion." }
        attempts: { type: integer, minimum: 0 }
        last_error_code:
          oneOf:
            - { $ref: "#/components/schemas/OperationErrorCode" }
            - { type: "null" }
        next_retry_at: { type: [string, "null"], format: date-time }
        requested_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        audit_id: { $ref: "#/components/schemas/AuditId" }
    OperationList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
        next_cursor: { type: [string, "null"] }
    SuspensionCategory:
      type: string
      enum: [abuse, chargeback_fraud, terms_violation, security, legal_request, pending_admin_deletion, other]
    SuspendRequest:
      type: object
      required: [reason, reason_category]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        reason_category:
          type: string
          enum: [abuse, chargeback_fraud, terms_violation, security, legal_request, other]
        duration_days: { type: integer, minimum: 1, maximum: 365, description: "Omit for no end date. The configured maximum can be lower." }
        blocklist: { type: boolean, default: false, description: "Also add keyed-hash entries (email, Google subject id) to the re-registration blocklist." }
        blocklist_days: { type: integer, minimum: 1, maximum: 730, description: "Expiry of the blocklist entries; omit for the configured default." }
        notify_user: { type: boolean, default: true }
    UnsuspendRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        remove_blocklist: { type: boolean, default: false }
        notify_user: { type: boolean, default: true }
    SuspensionResult:
      type: object
      required: [account_id, status, expires_at, sessions_revoked, manage_tokens_revoked, blocklist_entry_ids]
      additionalProperties: false
      properties:
        account_id: { $ref: "#/components/schemas/AccountId" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        expires_at: { type: [string, "null"], format: date-time }
        sessions_revoked: { type: integer, minimum: 0 }
        manage_tokens_revoked: { type: integer, minimum: 0 }
        blocklist_entry_ids:
          type: array
          items: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
    BlocklistEntry:
      type: object
      required: [entry_id, kind, state, created_at, expires_at, created_by_admin_id, reason_category, audit_id]
      additionalProperties: false
      properties:
        entry_id: { type: string, pattern: "^blk_[A-Za-z0-9]+$" }
        kind: { type: string, enum: [email, google_subject] }
        state: { type: string, enum: [active, expired, removed] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        reason_category: { $ref: "#/components/schemas/SuspensionCategory" }
        audit_id: { $ref: "#/components/schemas/AuditId" }
    BlocklistList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BlocklistEntry" }
        next_cursor: { type: [string, "null"] }
    DeletionRequest:
      type: object
      required: [reason, confirm_account_id]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        note: { type: string, maxLength: 500 }
        confirm_account_id: { $ref: "#/components/schemas/AccountId" }
        cooling_off_hours: { type: integer, minimum: 0, maximum: 72, default: 24 }
        notify_user: { type: boolean, default: true }
    Admin:
      type: object
      required: [admin_id, email, role, status, created_at, created_by_admin_id, last_seen_at, disabled_at]
      additionalProperties: false
      properties:
        admin_id: { $ref: "#/components/schemas/AdminId" }
        email: { type: [string, "null"], description: "Null once the admin is removed." }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, disabled, removed] }
        created_at: { type: string, format: date-time }
        created_by_admin_id: { type: [string, "null"], description: "Null for the bootstrap owner." }
        last_seen_at: { type: [string, "null"], format: date-time }
        disabled_at: { type: [string, "null"], format: date-time }
    AdminList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Admin" }
        next_cursor: { type: [string, "null"] }
    InvitationCreateRequest:
      type: object
      required: [email, role, reason]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: "#/components/schemas/Role" }
        reason: { $ref: "#/components/schemas/Reason" }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    Invitation:
      type: object
      description: The code is emailed to the invited address and is never part of any response.
      required: [invitation_id, email, role, state, expires_at, created_by_admin_id, created_at]
      additionalProperties: false
      properties:
        invitation_id: { type: string, pattern: "^inv_[A-Za-z0-9]+$" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { type: string, enum: [pending, accepted, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_by_admin_id: { $ref: "#/components/schemas/AdminId" }
        created_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_cursor: { type: [string, "null"] }
    InvitationAcceptRequest:
      type: object
      required: [invitation_code]
      additionalProperties: false
      properties:
        invitation_code: { type: string, minLength: 12, maxLength: 12, pattern: "^[A-HJ-NP-Z2-9]{12}$" }
    RoleChangeRequest:
      type: object
      required: [role, reason]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
        reason: { $ref: "#/components/schemas/Reason" }
    AuditAction:
      type: string
      enum:
        - admin.session_start
        - admin.reauth_start
        - admin.reauth_complete
        - admin.bootstrap
        - admin.invite
        - admin.invitation_revoke
        - admin.invitation_accept
        - admin.role_change
        - admin.disable
        - admin.enable
        - admin.remove
        - account.search
        - account.read
        - account.devices_read
        - account.suspend
        - account.unsuspend
        - account.suspension_expire
        - account.delete_request
        - account.delete_execute
        - device.revoke
        - sessions.revoke_all
        - grant.create
        - grant.list
        - grant.read
        - grant.shorten
        - grant.revoke
        - grant.expire
        - subscription.cancel
        - operation.retry
        - operation.withdraw
        - operation.step
        - blocklist.add
        - blocklist.remove
        - system.freeze
        - system.unfreeze
        - audit.export
        - audit.verify
        - retention.checkpoint
    AuditResult:
      type: string
      enum: [success, denied, failed, pending]
    AuditRow:
      type: object
      description: |
        Append-only and hash-chained. There is deliberately no field for an IP address, a user agent, content,
        a token or a code, and no email address. `params` is a small allowlisted map of non-personal scalar
        parameters (for example days, role, effective_from).
      required: [audit_id, seq, occurred_at, actor_kind, actor_admin_id, actor_role, action, target_account_id, target_admin_id, reason, request_id, result, result_code, params, prev_hash, row_hash]
      additionalProperties: false
      properties:
        audit_id: { $ref: "#/components/schemas/AuditId" }
        seq: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [admin, system] }
        actor_admin_id: { type: [string, "null"] }
        actor_role:
          oneOf:
            - { $ref: "#/components/schemas/Role" }
            - { type: "null" }
        action: { $ref: "#/components/schemas/AuditAction" }
        target_account_id: { type: [string, "null"] }
        target_admin_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        request_id: { type: string }
        result: { $ref: "#/components/schemas/AuditResult" }
        result_code:
          oneOf:
            - { $ref: "#/components/schemas/ErrorCode" }
            - { type: "null" }
        params:
          type: object
          additionalProperties:
            type: [string, integer, boolean, "null"]
        prev_hash: { $ref: "#/components/schemas/Sha256Hex" }
        row_hash: { $ref: "#/components/schemas/Sha256Hex" }
    AuditList:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditRow" }
        next_cursor: { type: [string, "null"] }
    AuditVerification:
      type: object
      required: [ok, rows_checked, head_seq, head_hash, first_broken_seq, last_anchor_seq, anchors_match]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        rows_checked: { type: integer, minimum: 0 }
        head_seq: { type: integer, minimum: 0 }
        head_hash: { $ref: "#/components/schemas/Sha256Hex" }
        first_broken_seq: { type: [integer, "null"] }
        last_anchor_seq: { type: [integer, "null"], description: "Sequence number of the latest head digest published outside the database." }
        anchors_match: { type: boolean, description: "The recomputed chain agrees with every published anchor." }
