          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuspensionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/v1/accounts/{account_id}/unsuspend:
    post:
      tags: [moderation]
      operationId: unsuspendAccount
      summary: Lift a suspension
      description: |
        Sets the status back to `active`. Budget windows kept running during the suspension (time is not
        paused). Sessions revoked by the suspension are not restored: the user signs in again. Optionally
        removes the blocklist entries created by that suspension.
