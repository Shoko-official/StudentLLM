name: Release

# Pushing a tag such as v0.1.0 builds unsigned desktop installers on all three
# platforms and attaches them, with SHA-256 checksums, to a draft GitHub release.
# The release stays a draft until a maintainer reviews and publishes it.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app version
        run: |
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          for v in "$tauri" "$pkg" "$crate"; do
            if [ "$TAG" != "v$v" ]; then
              echo "Tag $TAG does not match the app versions (tauri.conf.json $tauri, package.json $pkg, Cargo.toml $crate)" >&2
              exit 1
            fi
          done
      - name: Create the draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG is already published; refusing to modify it." >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "StudentLLM $TAG" \
              --notes "Unsigned desktop builds. See CHANGELOG.md for the changes and docs/desktop.md for the known limits (no bundled Python sidecars, no code signing yet). Verify downloads against the SHA256SUMS file for your platform. The macOS build is Apple Silicon only."
          fi

  build:
    needs: create-release
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
            dir: deb
            pattern: '*.deb'
          - os: windows-latest
            bundles: nsis
            dir: nsis
            pattern: '*-setup.exe'
          - os: macos-latest
            bundles: dmg
            dir: dmg
            pattern: '*.dmg'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Verify the web app
        run: npm run check && npm run test:run
      - name: Build the release bundle
        run: node scripts/desktop-command.mjs build --ci --no-sign --bundles ${{ matrix.bundles }}
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release-assets
          cp src-tauri/target/release/bundle/${{ matrix.dir }}/${{ matrix.pattern }} release-assets/
          cd release-assets
          if command -v sha256sum >/dev/null; then sha256sum * > "SHA256SUMS-${{ runner.os }}.txt"; else shasum -a 256 * > "SHA256SUMS-${{ runner.os }}.txt"; fi
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Attach installers to the draft release
        run: |
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ] || { echo "Release $TAG is not a draft; refusing to upload." >&2; exit 1; }
          ls -l release-assets
          gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
