name: Release

# Pushing a tag such as v0.1.0 builds unsigned desktop installers on all three
# platforms and attaches them, with SHA-256 checksums, to a draft GitHub release.
# The release stays a draft until a maintainer reviews and publishes it.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match src-tauri/tauri.conf.json version $version" >&2
            exit 1
          fi
      - name: Create the draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --draft \
            --title "StudentLLM $TAG" \
            --notes "Unsigned desktop builds. See CHANGELOG.md for the changes and docs/desktop.md for the known limits (no bundled Python sidecars, no code signing yet). Verify downloads against the SHA256SUMS file for your platform."

  build:
    needs: create-release
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Verify the web app
        run: npm run check && npm run test:run
      - name: Build the release bundle
        run: node scripts/desktop-command.mjs build --ci --no-sign --bundles ${{ matrix.bundles }}
      - name: Upload installers and checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          files=$(find . -type f \( -name '*.deb' -o -name '*-setup.exe' -o -name '*.dmg' \))
          if [ -z "$files" ]; then
            echo "No installer was produced" >&2
            exit 1
          fi
          mkdir -p ../../../../release-assets
          for f in $files; do cp "$f" ../../../../release-assets/; done
          cd ../../../../release-assets
          if command -v sha256sum >/dev/null; then sha256sum * > "SHA256SUMS-${{ runner.os }}.txt"; else shasum -a 256 * > "SHA256SUMS-${{ runner.os }}.txt"; fi
          gh release upload "$TAG" * --clobber
