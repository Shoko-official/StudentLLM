name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit declared Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements-local-documents.txt --progress-spinner off
          pip-audit -r requirements-speech-translation.txt --progress-spinner off
          pip-audit -r requirements-embeddings.txt --progress-spinner off
          pip-audit -r requirements-cloud-contract.txt --progress-spinner off
      - name: Validate cloud API contract
        run: |
          python -m pip install --disable-pip-version-check -r requirements-cloud-contract.txt
          python scripts/validate-cloud-contract.py
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run check
      - name: Benchmark adapter checks
        run: npm run benchmarks:check && npm run asr:test
      - name: Document sidecar tests with the real PDF engines
        run: |
          python -m pip install --disable-pip-version-check -r requirements-local-documents.txt
          python -m unittest tests.test_local_document_server tests.test_local_document_pdf tests.test_local_document_security tests.test_local_server_contract
      - name: Unit and integration tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Desktop debug build
        run: npm run desktop:build
      - name: Desktop shell check
        run: npm run desktop:check
      - name: Desktop Rust tests
        run: npm run desktop:test
      - name: Navigation guard without debug assertions
        # Pins the shipped behaviour (the dev server is denied). Only this crate is rebuilt; dependencies are reused.
        env:
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'false'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml navigation::tests::denies_the_dev_server_without_debug_assertions -- --exact 2>&1 | tee navigation-release.log
          grep -q "test result: ok. 1 passed" navigation-release.log

  licenses:
    name: Licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Licence policy self-test
        run: npm run licenses:test
      - name: Third-party notices match the lockfiles
        run: node scripts/generate-third-party-notices.mjs --check
      - name: No strong-copyleft or unknown licences (npm, Cargo, Python requirements)
        # Reads the lockfiles, `cargo metadata` and `pip install --dry-run --report`; nothing is installed.
        run: npm run licenses:check:all

  cloud-gateway:
    name: Cloud gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  desktop-platform-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Desktop debug build
        run: npm run desktop:build
      - name: Desktop Rust tests (Windows)
        if: runner.os == 'Windows'
        run: npm run desktop:test

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev sqlite3 xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Build desktop package
        env:
          VITE_STUDENTLLM_PACKAGED_IPC_SMOKE: 'true'
        run: npm run desktop:package
      - name: Check that the bundle carries the licence notices
        # .deb: dpkg -c; macOS: the .app contents; Windows: the NSIS script Tauri generates. No third-party action.
        run: node scripts/check-bundle-licenses.mjs
      - name: Smoke test packaged desktop runtime
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x920x24' node scripts/desktop-runtime-smoke.mjs src-tauri/target/debug/studentllm --crash-recovery --recovery-cycles=10 --sidecar-supervision --frontend-ipc --single-instance
      - name: Smoke test packaged desktop runtime
        if: runner.os != 'Linux'
        run: node scripts/desktop-runtime-smoke.mjs src-tauri/target/debug/studentllm --crash-recovery --recovery-cycles=10 --sidecar-supervision --frontend-ipc --single-instance
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studentllm-${{ matrix.os }}
          path: src-tauri/target/debug/bundle/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Browser tests with the production Content Security Policy
        run: npm run test:e2e:csp

  desktop-ui:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-0t64 libasound2t64 libatk-bridge2.0-0t64 libcups2t64 webkit2gtk-driver xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install dependencies
        run: npm ci
      - name: Build desktop debug binary
        env:
          VITE_STUDENTLLM_DESKTOP_UI: 'true'
        run: npm run desktop:build -- --config src-tauri/tauri.webdriver.conf.json
      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Enable WebView2 automation policy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edgePolicyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edgePolicyPath -Force | Out-Null
          New-ItemProperty -Path $edgePolicyPath -Name 'RemoteDebuggingAllowed' -PropertyType DWord -Value 1 -Force | Out-Null
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'studentllm.exe' -PropertyType String -Value '--remote-debugging-port=0' -Force | Out-Null
          Get-ItemProperty -Path $edgePolicyPath -Name 'RemoteDebuggingAllowed'
          Get-ItemProperty -Path $policyPath -Name 'studentllm.exe'
      - name: Run packaged desktop UI tests (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x920x24' npm run test:desktop-ui
      - name: Run packaged desktop UI tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop-ui
