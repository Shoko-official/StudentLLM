name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Benchmark adapter checks
        run: npm run benchmarks:check
      - name: Unit and integration tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Desktop debug build
        run: npm run desktop:build
      - name: Desktop shell check
        run: npm run desktop:check
      - name: Desktop Rust tests
        run: npm run desktop:test

  desktop-platform-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Desktop debug build
        run: npm run desktop:build

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev sqlite3 xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build desktop package
        env:
          VITE_STUDENTLLM_PACKAGED_IPC_SMOKE: 'true'
        run: npm run desktop:package
      - name: Smoke test packaged desktop runtime
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x920x24' node scripts/desktop-runtime-smoke.mjs src-tauri/target/debug/studentllm --crash-recovery --recovery-cycles=10 --sidecar-supervision --frontend-ipc
      - name: Smoke test packaged desktop runtime
        if: runner.os != 'Linux'
        run: node scripts/desktop-runtime-smoke.mjs src-tauri/target/debug/studentllm --crash-recovery --recovery-cycles=10 --sidecar-supervision --frontend-ipc
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studentllm-${{ matrix.os }}
          path: src-tauri/target/debug/bundle/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  desktop-ui:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-0t64 libasound2t64 libatk-bridge2.0-0t64 libcups2t64 webkit2gtk-driver xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build desktop debug binary
        env:
          VITE_STUDENTLLM_DESKTOP_UI: 'true'
        run: npm run desktop:build -- --config src-tauri/tauri.webdriver.conf.json
      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Enable WebView2 automation policy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edgePolicyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edgePolicyPath -Force | Out-Null
          New-ItemProperty -Path $edgePolicyPath -Name 'RemoteDebuggingAllowed' -PropertyType DWord -Value 1 -Force | Out-Null
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'studentllm.exe' -PropertyType String -Value '--remote-debugging-port=0' -Force | Out-Null
          Get-ItemProperty -Path $edgePolicyPath -Name 'RemoteDebuggingAllowed'
          Get-ItemProperty -Path $policyPath -Name 'studentllm.exe'
      - name: Run packaged desktop UI tests (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x920x24' npm run test:desktop-ui
      - name: Run packaged desktop UI tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop-ui
