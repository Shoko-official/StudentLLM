[package]
name = "studentllm"
version = "0.1.0"
description = "Local-first learning workspace"
authors = ["Shoko-official"]
edition = "2021"
# The zbus family (a Linux dependency of the single-instance plugin) needs Rust 1.87; the other crates added with it need less.
rust-version = "1.87"

[lib]
name = "studentllm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-wdio = "1"

# Pinned. 2.4.5 is the newest release that accepts the tauri 2.11 line (2.5.x requires tauri 2.12)
# and it is more than 14 days old. It does not exist on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.4.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
