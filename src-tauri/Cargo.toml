[package]
name = "studentllm"
version = "0.1.0"
description = "Local-first learning workspace"
authors = ["Shoko-official"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studentllm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
